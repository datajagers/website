<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fragment+Mono&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; }
    a { color: inherit; text-decoration: none; }
    a:hover { color: inherit; }
    /* footer: FAQ-hover op navsecties + ArrowCTA-nudge op contactlink */
    [data-foot-link] .fl-circ { transform: scale(0.4); opacity: 0; transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1); }
    [data-foot-link]:hover .fl-circ { transform: scale(1); opacity: 1; }
    [data-foot-link] .fl-label { display: inline-block; flex: 1; transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), color 0.5s cubic-bezier(0.22, 1, 0.36, 1); }
    [data-foot-link]:hover .fl-label { transform: translateX(8px); color: #ffffff; }
    @media (prefers-reduced-motion: reduce) { [data-foot-link] .fl-circ, [data-foot-link] .fl-label, [data-foot-cta] .fc-label, }
    /* mobiel: tapdoelen >= 44px zonder visuele verschuiving */
    @media (max-width: 859px) { [data-foot-cta] { padding-top: 14px; } [data-foot-link] { padding: 7px 0; } [data-foot-social] a { padding: 10px 0; } }
  </style>
</helmet>

<!-- Sheet-reveal footer — identiek aan de homepage; de sectie vóór dit component hoort
     in een sticky [data-page-hold] zodat hij stilstaat tijdens de reveal. -->
<section data-foot-track="" style="position: relative; z-index: 3; height: 220vh; margin-top: -100vh; pointer-events: none; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;">
  <div style="position: sticky; top: 0; height: 100vh; overflow: hidden; display: flex; align-items: flex-end;">
  <footer id="site-footer" data-foot-sheet="" style="position: relative; width: 100%; height: 100vh; overflow: hidden; background: #1D1D1D; color: #f2f5f9; border-radius: 5px 5px 0 0; transform: translateY(101%); will-change: transform; pointer-events: auto; display: flex; flex-direction: column;">
    <div style="max-width: 1320px; width: 100%; margin: 0 auto; padding: 0 clamp(24px, 4vw, 64px) clamp(24px, 4vw, 64px); flex: 1; min-height: 0; display: flex; flex-direction: column;">

      <div style="border-top: 1px solid var(--dj-rule,rgba(242,245,249,0.14)); margin-top: clamp(16px, 2vw, 28px); flex: 1; min-height: 0; align-content: center; padding: clamp(16px, 2vw, 32px) 0; display: grid; grid-template-columns: {{ footCols }}; gap: clamp(36px, 6vw, 100px); align-items: start;">

        <!-- links: uitnodiging + e-mail + CTA -->
        <div style="display: flex; flex-direction: column; align-items: flex-start;">
          <div style="font-size: clamp(24px, 2.5vw, 48px); font-weight: 700; line-height: 1.25; letter-spacing: -0.04em; color: rgba(242,245,249,0.38); text-wrap: balance;">Klaar om samen te werken?</div>
          <a href="mailto:info@datajagers.nl" style="font-size: clamp(24px, 2.5vw, 48px); font-weight: 700; line-height: 1.25; letter-spacing: -0.04em; color: #f2f5f9; overflow-wrap: anywhere;" style-hover="color: var(--dj-hover,#93c3fd);">info@datajagers.nl</a>
          <a data-cta data-foot-cta="" href="{{ ctaHref }}" style="margin-top: clamp(18px, 2.2vw, 32px); display: inline-flex; align-items: baseline; gap: 12px; color: #f2f5f9; border-bottom: 1px solid rgba(242,245,249,0.7); padding-bottom: 10px;" style-hover="color: var(--dj-hover,#93c3fd);">
            <span class="fc-label" style="display: inline-block; font-size: clamp(15px, 0.85vw, 16px); font-weight: 400; letter-spacing: -0.02em;">{{ ctaLabel }}</span>
            <svg class="fc-arrow" viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true" style="flex: none;"><path d="M1 11 11 1M4 1h7v7"></path></svg>
          </a>
        </div>

        <!-- rechts: genummerde nav -->
        <nav aria-label="Footer" style="display: flex; flex-direction: column;">
          <sc-for list="{{ links }}" as="fl" hint-placeholder-count="5">
            <a data-foot-link="" href="{{ fl.href }}" style="display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--dj-rule,rgba(242,245,249,0.14)); color: rgba(242,245,249,0.85); font-size: clamp(15px, 0.85vw, 16px); font-weight: 400; letter-spacing: -0.02em; line-height: 1.6;">
              <span class="fl-label">{{ fl.label }}</span>
              <span aria-hidden="true" style="position: relative; flex: none; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center;">
                <span class="fl-circ" style="position: absolute; inset: 0; border-radius: 999px; background: rgba(97,166,251,0.22);"></span>
                <span style="position: relative; z-index: 1; font-family: 'Fragment Mono', ui-monospace, monospace; font-size: 14px; color: rgba(242,245,249,0.55); font-feature-settings: 'tnum';">{{ fl.num }}</span>
              </span>
            </a>
          </sc-for>
        </nav>
      </div>

      <!-- onderregel: social + copyright + meetlat -->
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 8px 0 14px; flex-wrap: wrap;">
        <div data-foot-social="" style="display: flex; gap: 22px; font-family: 'Fragment Mono', ui-monospace, monospace; font-size: 14px; line-height: 1.6; text-transform: uppercase;">
          <a href="https://www.linkedin.com" style="color: rgba(242,245,249,0.65);" style-hover="color: var(--dj-hover,#93c3fd);">LinkedIn</a>
          <a href="https://www.instagram.com" style="color: rgba(242,245,249,0.65);" style-hover="color: var(--dj-hover,#93c3fd);">Instagram</a>
          <a href="mailto:info@datajagers.nl" style="color: rgba(242,245,249,0.65);" style-hover="color: var(--dj-hover,#93c3fd);">Mail</a>
        </div>
        <div style="display: flex; align-items: center; gap: 16px; font-family: 'Fragment Mono', ui-monospace, monospace; font-size: 14px; color: rgba(242,245,249,0.65); font-feature-settings: 'tnum';">
          <span>© 2026</span>
          <span aria-hidden="true" style="display: flex; align-items: flex-end; gap: 5px;">
            <span style="width: 1px; height: 8px; background: rgba(242,245,249,0.3);"></span><span style="width: 1px; height: 8px; background: rgba(242,245,249,0.3);"></span><span style="width: 1px; height: 8px; background: rgba(242,245,249,0.3);"></span><span style="width: 1px; height: 13px; background: rgba(242,245,249,0.5);"></span><span style="width: 1px; height: 8px; background: rgba(242,245,249,0.3);"></span><span style="width: 1px; height: 8px; background: rgba(242,245,249,0.3);"></span><span style="width: 1px; height: 8px; background: rgba(242,245,249,0.3);"></span><span style="width: 1px; height: 8px; background: rgba(242,245,249,0.3);"></span><span style="width: 1px; height: 8px; background: rgba(242,245,249,0.3);"></span>
          </span>
          <span>26’</span>
        </div>
      </div>

      <!-- reuzen-wordmark, volledig zichtbaar boven de onderpadding -->
      <span role="img" aria-label="datajagers" style="display: block; width: 100%; aspect-ratio: 1157 / 127; margin-top: 6px; -webkit-mask: url('assets/logo_wordmark.svg') center / contain no-repeat; mask: url('assets/logo_wordmark.svg') center / contain no-repeat; background: #f2f5f9;"></span>
    </div>
  </footer>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1280, &quot;height&quot;: 720 },
  &quot;home&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Links&quot; },
  &quot;contactHref&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;#contact&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Links&quot; },
  &quot;ctaHref&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;#contact&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Call-to-action&quot; },
  &quot;ctaLabel&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Neem contact op&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Call-to-action&quot; }
}">
class Component extends DCLogic {
  state = { mobile: (typeof window !== 'undefined' ? window.innerWidth < 860 : false) };

  componentDidMount() {
    this._mq = window.matchMedia('(max-width: 859px)');
    this._onMq = (e) => this.setState({ mobile: e.matches });
    this.setState({ mobile: this._mq.matches });
    if (this._mq.addEventListener) this._mq.addEventListener('change', this._onMq);

    this._onScroll = () => {
      if (this._raf) return;
      this._raf = requestAnimationFrame(() => { this._raf = null; this._apply(); });
    };
    window.addEventListener('scroll', this._onScroll, { passive: true });
    window.addEventListener('resize', this._onScroll);
    this._apply();
  }

  componentWillUnmount() {
    if (this._mq && this._mq.removeEventListener) this._mq.removeEventListener('change', this._onMq);
    window.removeEventListener('scroll', this._onScroll);
    window.removeEventListener('resize', this._onScroll);
    if (this._raf) cancelAnimationFrame(this._raf);
  }

  _apply() {
    const track = document.querySelector('[data-foot-track]');
    const sheet = document.querySelector('[data-foot-sheet]');
    if (!track || !sheet) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { sheet.style.transform = 'none'; return; }
    const r = track.getBoundingClientRect();
    const total = r.height - window.innerHeight;
    const p = Math.max(0, Math.min(1, (-r.top) / total));
    const e = 1 - Math.pow(1 - p, 3);
    sheet.style.transform = 'translateY(' + ((1 - e) * 101).toFixed(2) + '%)';
  }

  renderVals() {
    const home = this.props.home || '';
    return {
      footCols: this.state.mobile ? '1fr' : 'minmax(0, 1.5fr) minmax(260px, 1fr)',
      ctaHref: this.props.ctaHref ?? (home + '#contact'),
      ctaLabel: this.props.ctaLabel ?? 'Neem contact op',
      links: [
        { label: 'Home', href: home + '#top', num: '01' },
        { label: 'Wie we zijn', href: home + '#verhaal', num: '02' },
        { label: 'Diensten', href: home + '#diensten', num: '03' },
        { label: 'FAQ', href: home + '#faq', num: '04' },
        { label: 'Contact', href: this.props.contactHref ?? (home + '#contact'), num: '05' },
      ],
    };
  }
}
</script>
</body>
</html>
