  <script>
    // Synchrone pre-paint: het coal-doek staat op het allereerste frame van
    // het geswapte document; curtains.js kleedt het aan (vizier) en onthult.
    (function () {
      try { if (localStorage.getItem('dj-theme') !== 'light') document.documentElement.classList.add('dj-dark'); } catch (e) {}
      if (document.getElementById('dj-preloader')) return;
      var pl = document.createElement('div');
      pl.id = 'dj-preloader';
      var s = pl.style;
      s.position = 'fixed'; s.top = '0'; s.left = '0'; s.right = '0'; s.bottom = '0';
      s.zIndex = '3000'; s.overflow = 'hidden'; s.background = 'transparent';
      var cover = document.createElement('div');
      cover.className = 'dj-pl-cover';
      cover.setAttribute('aria-hidden', 'true');
      var cs = cover.style;
      cs.position = 'absolute'; cs.top = '0'; cs.left = '0'; cs.right = '0'; cs.bottom = '0';
      cs.background = '#1D1D1D'; cs.willChange = 'clip-path';
      pl.appendChild(cover);
      (document.body || document.documentElement).appendChild(pl);
    })();
  </script>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #1D1D1D; }
    body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    a:hover { color: inherit; }
    input, select, textarea, button { font: inherit; color: inherit; }
    ::placeholder { color: #7d7d7d; }
    input:focus, select:focus, textarea:focus { outline: none; }

  </style>
  <script src="b0dff027-7706-40d4-a56a-82c9d3b6bea8"></script>
</helmet>

<div style="width: 100%; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #1D1D1D;">

  <div data-page-hold="" style="position: relative;">

  <!-- ================= FORM — 1:1 naar referentie ================= -->
  <section id="contact" data-contact-pin="" style="position: relative; z-index: 0; background: #1D1D1D; color: #ffffff; padding: clamp(24px, 3vw, 40px) clamp(18px, 2vw, 28px) clamp(56px, 7vw, 96px) clamp(18px, 2vw, 28px);">
    <div style="max-width: 1500px; margin: 0 auto;">

      <!-- navbar — gedeeld component -->
      <dc-import name="Navbar" home="index.html" contact-href="#contact" active="Contact" hint-size="100%,120px"></dc-import>

<div style="display: grid; grid-template-columns: {{ heroCols }}; gap: clamp(32px, 8vw, 160px); align-items: stretch;">

        <!-- beeld -->
        <div style="position: relative; border-radius: 5px; overflow: hidden; background: #191919; min-height: clamp(340px, 42vw, 760px);">
          <image-slot id="contact-portret" shape="rect" fit="cover" placeholder="Sleep hier een staande studioportretfoto (min. 1200 × 1700)" src="3a2e1da2-358f-452b-9440-4f4d56ec4354"></image-slot>
          <span aria-hidden="true" style="position: absolute; left: 20px; top: 18px; pointer-events: none; width: clamp(46px, 5vw, 66px); aspect-ratio: 1157 / 127; -webkit-mask: url(&quot;5294439a-9003-4e85-a043-964436331e0a&quot;) center / contain no-repeat; mask: url(&quot;5294439a-9003-4e85-a043-964436331e0a&quot;) center / contain no-repeat; background: rgba(255,255,255,0.92);"></span>
        </div>

        <!-- formulier -->
        <div style="display: flex; flex-direction: column; justify-content: flex-start; padding: clamp(12px, 4.5vw, 76px) 0 0 0;">
          <h1 style="margin: 0; font-size: clamp(40px, 5.4vw, 92px); font-weight: 700; line-height: 1.02; letter-spacing: -0.04em; color: #ffffff; white-space: nowrap;">Neem contact op<span style="color: #ffffff;">”</span></h1>
          <p style="margin: clamp(40px, 5.5vw, 88px) 0 0 0; max-width: 430px; font-size: 15px; font-weight: 400; line-height: 1.5; letter-spacing: -0.01em; color: #a3a3a3;">Kies een onderwerp, laat je vraag achter en je <span style="color: #7d7d7d;">traject</span> start binnen 24 uur.</p>

          <form sc-camel-on-submit="{{ onSubmit }}" novalidate>
          <div style="display: grid; grid-template-columns: {{ fieldCols }}; gap: clamp(40px, 6vw, 92px) 26px; margin-top: clamp(48px, 8vw, 128px);">

            <label style="display: block;">
              <span style="display: block; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: #ffffff;">Voornaam*</span>
              <input type="text" name="voornaam" autocomplete="given-name" required aria-required="true" aria-invalid="{{ invVoornaam }}" aria-describedby="err-voornaam" placeholder="Jim" value="{{ vVoornaam }}" sc-camel-on-change="{{ onVoornaam }}" style="width: 100%; margin-top: 22px; padding: 0 0 13px 0; background: transparent; border: 0; border-bottom: 1px solid var(--dj-rule,rgba(242,245,249,0.14)); font-size: 16px; font-weight: 400; letter-spacing: -0.01em; color: #ffffff; transition: border-color 0.25s ease;" style-focus="border-bottom-color: #ffffff;">
            
              <p id="err-voornaam" style="{{ errStyleVoornaam }}">{{ errVoornaam }}</p>
            </label>

            <label style="display: block;">
              <span style="display: block; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: #ffffff;">Achternaam*</span>
              <input type="text" name="achternaam" autocomplete="family-name" required aria-required="true" aria-invalid="{{ invAchternaam }}" aria-describedby="err-achternaam" placeholder="Hopper" value="{{ vAchternaam }}" sc-camel-on-change="{{ onAchternaam }}" style="width: 100%; margin-top: 22px; padding: 0 0 13px 0; background: transparent; border: 0; border-bottom: 1px solid var(--dj-rule,rgba(242,245,249,0.14)); font-size: 16px; font-weight: 400; letter-spacing: -0.01em; color: #ffffff; transition: border-color 0.25s ease;" style-focus="border-bottom-color: #ffffff;">
            
              <p id="err-achternaam" style="{{ errStyleAchternaam }}">{{ errAchternaam }}</p>
            </label>

            <label style="display: block; position: relative;">
              <span style="display: block; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: #ffffff;">Onderwerp</span>
              <sc-raw-select name="onderwerp" value="{{ vOnderwerp }}" sc-camel-on-change="{{ onOnderwerp }}" style="width: 100%; margin-top: 22px; padding: 0 28px 13px 0; background: transparent; border: 0; border-bottom: 1px solid var(--dj-rule,rgba(242,245,249,0.14)); font-size: 16px; font-weight: 400; letter-spacing: -0.01em; color: {{ selectColor }}; -webkit-appearance: none; appearance: none; cursor: pointer; transition: border-color 0.25s ease;" style-focus="border-bottom-color: #ffffff;">
                <option value="" style="color: #1D1D1D;">Selecteer</option>
                <option value="scan" style="color: #1D1D1D;">Data Clarity Scan</option>
                <option value="dashboards" style="color: #1D1D1D;">Dashboards &amp; rapportage</option>
                <option value="automatisering" style="color: #1D1D1D;">Automatisering</option>
                <option value="ai" style="color: #1D1D1D;">AI-integratie</option>
                <option value="anders" style="color: #1D1D1D;">Iets anders</option>
              </sc-raw-select>
              <svg aria-hidden="true" width="15" height="9" sc-camel-view-box="0 0 14 9" fill="none" style="position: absolute; right: 2px; bottom: 17px; pointer-events: none; color: #d4d4d4;"><path d="M1 1L7 7L13 1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            </label>

            <label style="display: block;">
              <span style="display: block; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: #ffffff;">E-mail*</span>
              <input type="email" name="email" autocomplete="email" required aria-required="true" aria-invalid="{{ invEmail }}" aria-describedby="err-email" placeholder="info@datajagers.nl" value="{{ vEmail }}" sc-camel-on-change="{{ onEmail }}" style="width: 100%; margin-top: 22px; padding: 0 0 13px 0; background: transparent; border: 0; border-bottom: 1px solid var(--dj-rule,rgba(242,245,249,0.14)); font-size: 16px; font-weight: 400; letter-spacing: -0.01em; color: #ffffff; transition: border-color 0.25s ease;" style-focus="border-bottom-color: #ffffff;">
            
              <p id="err-email" style="{{ errStyleEmail }}">{{ errEmail }}</p>
            </label>

            <label style="display: block; grid-column: 1 / -1;">
              <span style="display: block; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: #ffffff;">Bericht*</span>
              <textarea name="bericht" required aria-required="true" aria-invalid="{{ invBericht }}" aria-describedby="err-bericht" rows="4" placeholder="Typ je bericht....." value="{{ vBericht }}" sc-camel-on-change="{{ onBericht }}" style="width: 100%; margin-top: 22px; padding: 0 0 16px 0; background: transparent; border: 0; border-bottom: 1px solid var(--dj-rule,rgba(242,245,249,0.14)); font-size: 16px; font-weight: 400; line-height: 1.6; letter-spacing: -0.01em; color: #ffffff; resize: vertical; min-height: 148px; transition: border-color 0.25s ease;" style-focus="border-bottom-color: #ffffff;"></textarea>
            
              <p id="err-bericht" style="{{ errStyleBericht }}">{{ errBericht }}</p>
            </label>
          </div>

          <p role="status" aria-live="polite" style="{{ statusStyle }}">{{ statusText }}</p>
          <button type="submit" data-comment-anchor="contact-submit" style="margin-top: clamp(40px, 6vw, 92px); width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 12px; padding: 15px 26px; border: 0; border-radius: 5px; background: {{ btnBg }}; color: #ffffff; font-size: 16px; font-weight: 400; letter-spacing: -0.01em; cursor: pointer; transition: background 0.25s ease;" style-hover="background: {{ btnBgHover }};">{{ btnLabel }}</button>
          </form>
        </div>
      </div>
    </div>

  </section>

  <!-- ================= FAQ — schuift met diagonale snede over het gepinde formulier ================= -->
  <div id="faq" style="position: relative; z-index: 1;">
    <dc-import name="FAQ Sectie" cta-label="Plan een gesprek" cta-href="#contact" hint-size="100%,720px"></dc-import>
    <!-- uitloop: laatste vraag + sticky kolom volledig in beeld vóór de footer-reveal -->
    <div aria-hidden="true" style="height: clamp(200px, 38vh, 420px); background: var(--dj-surface,#f6f6f4);"></div>
  </div>

  </div><!-- einde page-hold -->

  <!-- ================= FOOTER — gedeeld component ================= -->

<dc-import name="Footer" home="index.html" contact-href="#contact" cta-href="#contact" cta-label="Naar het formulier" hint-size="100%,2200px"></dc-import>

  <!-- persistente bodemfog — continuïteit door de hele scroll -->
  <div data-dj-fog="" aria-hidden="true" style="position: fixed; left: 0; right: 0; bottom: 0; height: 96px; pointer-events: none; z-index: 30; background: linear-gradient(to top, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.02) 55%, rgba(255,255,255,0) 100%); -webkit-backdrop-filter: blur(12px) saturate(1.35) brightness(1.04); backdrop-filter: blur(12px) saturate(1.35) brightness(1.04); -webkit-mask-image: linear-gradient(to top, #000 0%, #000 26%, transparent 100%); mask-image: linear-gradient(to top, #000 0%, #000 26%, transparent 100%);"></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{
  &quot;submitLabel&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Verstuur&quot;, &quot;tsType&quot;: &quot;string&quot; }
}">
class Component extends DCLogic {
  state = {
    mobile: (typeof window !== 'undefined' ? window.innerWidth < 860 : false),
    narrow: (typeof window !== 'undefined' ? window.innerWidth < 1180 : false),
    form: { voornaam: '', achternaam: '', onderwerp: '', email: '', bericht: '' },
    errors: {},
    sent: false,
    menuOpen: false,
  };

  componentDidMount() {
    this._mq = window.matchMedia('(max-width: 859px)');
    this._onMq = (e) => { this.setState({ mobile: e.matches }); this._fitPageHold(); };
    this.setState({ mobile: this._mq.matches });
    if (this._mq.addEventListener) this._mq.addEventListener('change', this._onMq);
    this._mqN = window.matchMedia('(max-width: 1179px)');
    this._onMqN = (e) => this.setState({ narrow: e.matches, menuOpen: false });
    this.setState({ narrow: this._mqN.matches });
    if (this._mqN.addEventListener) this._mqN.addEventListener('change', this._onMqN);

    // footer sheet-reveal — identiek aan de hoofdpagina
    this._onScroll = () => {
      this._startWig();
      if (this._raf) return;
      this._raf = requestAnimationFrame(() => { this._raf = null; this._applyFooterSheet(); });
    };
    window.addEventListener('scroll', this._onScroll, { passive: true });
    this._onResize = () => { this._fitPageHold(); this._applyFooterSheet(); };
    window.addEventListener('resize', this._onResize);

    this._fitPageHold();
    this._applyFooterSheet();
    this._startWig();
    const hold = document.querySelector('[data-page-hold]');
    if (hold && window.ResizeObserver) {
      this._ro = new ResizeObserver(() => this._fitPageHold());
      this._ro.observe(hold);
    }
  }

  componentWillUnmount() {
    if (this._mq && this._mq.removeEventListener) this._mq.removeEventListener('change', this._onMq);
    if (this._mqN && this._mqN.removeEventListener) this._mqN.removeEventListener('change', this._onMqN);
    window.removeEventListener('scroll', this._onScroll);
    window.removeEventListener('resize', this._onResize);
    if (this._ro) this._ro.disconnect();
    if (this._raf) cancelAnimationFrame(this._raf);
    if (this._wigRaf) cancelAnimationFrame(this._wigRaf);
  }

  // diagonale wig: kantelt van horizontaal naar diagonaal tijdens het scrollen,
  // met een onderkritisch gedempte veer (licht overshoot = elastisch gevoel)
  _startWig() {
    if (this._wigRaf) return;
    if (this._wigT === undefined) { this._wigT = 0; this._wigV = 0; }
    const step = () => {
      const wig = document.querySelector('[data-faq-wig]');
      const faq = document.getElementById('faq');
      if (!wig || !faq) { this._wigRaf = null; return; }
      const vh = window.innerHeight;
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const r = faq.getBoundingClientRect();
      const raw = Math.max(0, Math.min(1, (vh * 1.25 - r.top) / (vh * 0.85)));
      // scroll delay: het doel hobbelt vertraagd achter de scroll aan
      if (this._wigD === undefined) this._wigD = raw;
      this._wigD += (raw - this._wigD) * (reduce ? 1 : 0.07);
      const target = this._wigD;
      if (reduce) {
        this._wigT = target; this._wigV = 0;
      } else {
        this._wigV += (target - this._wigT) * 0.106;
        this._wigV *= 0.875;
        this._wigT += this._wigV;
      }
      const t = Math.max(0, Math.min(1.15, this._wigT));
      const y = (100 - t * 100).toFixed(2);
      wig.style.clipPath = 'polygon(0 100%, 100% ' + y + '%, 100% 100%)';
      // de wig groeit mee in hoogte: van 35% naar 100% van zijn maximum
      const maxH = Math.min(225, Math.max(105, window.innerWidth * 0.135));
      wig.style.height = (maxH * (0.35 + 0.65 * Math.min(1, t))).toFixed(1) + 'px';
      if (!reduce && (Math.abs(raw - this._wigT) > 0.001 || Math.abs(this._wigV) > 0.001 || Math.abs(raw - this._wigD) > 0.001)) {
        this._wigRaf = requestAnimationFrame(step);
      } else {
        this._wigRaf = null;
      }
    };
    this._wigRaf = requestAnimationFrame(step);
  }

  _applyFooterSheet() {
    const track = document.querySelector('[data-foot-track]');
    const sheet = document.querySelector('[data-foot-sheet]');
    if (!track || !sheet) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { sheet.style.transform = 'none'; return; }
    const r = track.getBoundingClientRect();
    const total = r.height - window.innerHeight;
    const p = Math.max(0, Math.min(1, (-r.top) / total));
    const e = 1 - Math.pow(1 - p, 3);
    sheet.style.transform = 'translateY(' + ((1 - e) * 101).toFixed(2) + '%)';
  }

  // sticky top = -(inhoudshoogte - viewport): de content pint zodra zijn onderkant de
  // viewportbodem raakt en staat dan compositor-stil terwijl de footer eroverheen schuift.
  _fitPageHold() {
    const hold = document.querySelector('[data-page-hold]');
    if (hold) {
      const val = (-(Math.max(0, hold.offsetHeight - window.innerHeight))).toFixed(0) + 'px';
      if (hold.style.position !== 'sticky') hold.style.position = 'sticky';
      if (hold.style.top !== val) hold.style.top = val;
    }
    // zelfde truc voor het contactformulier: pint zodra zijn onderkant in beeld is,
    // waarna de FAQ er met de diagonale wig overheen schuift
    const pin = document.querySelector('[data-contact-pin]');
    if (pin) {
      const val = (-(Math.max(0, pin.offsetHeight - window.innerHeight))).toFixed(0) + 'px';
      if (pin.style.position !== 'sticky') pin.style.position = 'sticky';
      if (pin.style.top !== val) pin.style.top = val;
    }
  }

  set(key) {
    return (e) => {
      const v = e && e.target ? e.target.value : '';
      this.setState((s) => {
        const errors = Object.assign({}, s.errors);
        delete errors[key];
        return { form: Object.assign({}, s.form, { [key]: v }), errors: errors, sent: false };
      });
    };
  }

  ONDERWERPEN = {
    '': 'Niet opgegeven',
    scan: 'Data Clarity Scan',
    dashboards: 'Dashboards & rapportage',
    automatisering: 'Automatisering',
    ai: 'AI-integratie',
    anders: 'Iets anders',
  };

  renderVals() {
    const f = this.state.form;
    const err = this.state.errors || {};
    const errStyle = (msg) => 'margin: 8px 0 0; font-size: 13.5px; line-height: 1.45; color: #ff9f9f; display: '
      + (msg ? 'block' : 'none') + ';';
    return {
      heroCols: this.state.mobile ? '1fr' : '1.25fr 1fr',
      fieldCols: this.state.mobile ? '1fr' : '1fr 1fr',
      footCols: this.state.mobile ? '1fr' : 'minmax(0, 1.5fr) minmax(240px, 1fr)',
      selectColor: f.onderwerp ? '#ffffff' : '#7d7d7d',
      vVoornaam: f.voornaam, vAchternaam: f.achternaam, vOnderwerp: f.onderwerp,
      vEmail: f.email, vBericht: f.bericht,
      onVoornaam: this.set('voornaam'),
      onAchternaam: this.set('achternaam'),
      onOnderwerp: this.set('onderwerp'),
      onEmail: this.set('email'),
      onBericht: this.set('bericht'),
      onSubmit: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const v = this.state.form;
        const errors = {};
        if (!String(v.voornaam || '').trim()) errors.voornaam = 'Vul je voornaam in.';
        if (!String(v.achternaam || '').trim()) errors.achternaam = 'Vul je achternaam in.';
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v.email || '').trim())) {
          errors.email = 'Vul een geldig e-mailadres in.';
        }
        if (!String(v.bericht || '').trim()) errors.bericht = 'Laat een bericht achter.';

        if (Object.keys(errors).length) {
          this.setState({ errors: errors, sent: false });
          // Move focus to the first field that failed so the error is announced.
          const first = ['voornaam', 'achternaam', 'email', 'bericht']
            .find((k) => errors[k]);
          const el = document.querySelector('[name="' + first + '"]');
          if (el && el.focus) el.focus();
          return;
        }

        // No backend ships with this site, so the form hands the message to the
        // visitor's mail client with every field laid out — the lead arrives as
        // a real email instead of being dropped on the floor.
        const onderwerp = (this.ONDERWERPEN[v.onderwerp] || 'Niet opgegeven');
        const body = [
          'Naam: ' + v.voornaam + ' ' + v.achternaam,
          'E-mail: ' + v.email,
          'Onderwerp: ' + onderwerp,
          '',
          'Bericht:',
          v.bericht,
        ].join('\n');
        window.location.href = 'mailto:info@datajagers.nl'
          + '?subject=' + encodeURIComponent('Aanvraag via datajagers.nl — ' + onderwerp)
          + '&body=' + encodeURIComponent(body);
        this.setState({ errors: {}, sent: true });
      },
      errVoornaam: err.voornaam || '', errStyleVoornaam: errStyle(err.voornaam),
      errAchternaam: err.achternaam || '', errStyleAchternaam: errStyle(err.achternaam),
      errEmail: err.email || '', errStyleEmail: errStyle(err.email),
      errBericht: err.bericht || '', errStyleBericht: errStyle(err.bericht),
      invVoornaam: err.voornaam ? 'true' : 'false',
      invAchternaam: err.achternaam ? 'true' : 'false',
      invEmail: err.email ? 'true' : 'false',
      invBericht: err.bericht ? 'true' : 'false',
      statusText: this.state.sent
        ? 'Je mailprogramma is geopend met je bericht. Verstuur het daar om de aanvraag af te ronden.'
        : (Object.keys(err).length ? 'Controleer de gemarkeerde velden.' : ''),
      statusStyle: 'margin: 24px 0 0; font-size: 14px; line-height: 1.5; color: '
        + (this.state.sent ? '#7fd4a8' : '#ff9f9f') + '; display: '
        + (this.state.sent || Object.keys(err).length ? 'block' : 'none') + ';',
      btnLabel: this.state.sent ? 'Geopend in je mailprogramma' : (this.props.submitLabel || 'Verstuur'),
      btnBg: this.state.sent ? '#1f8a5b' : '#3a3a3a',
      btnBgHover: this.state.sent ? '#1f8a5b' : '#4a4a4a',

      footLinks: [
        { label: 'Home', href: 'index.html', num: '01' },
        { label: 'Wie we zijn', href: 'index.html#verhaal', num: '02' },
        { label: 'Diensten', href: 'index.html#diensten', num: '03' },
        { label: 'FAQ', href: 'index.html#faq', num: '04' },
        { label: 'Contact', href: '#contact', num: '05' },
      ],
    };
  }
}
</script>



</body></html>
