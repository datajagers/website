document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rection: column; justify-content: flex-start; padding: clamp(12px, 4.5vw, 76px) 0 0 0;\">\n          <h1 style=\"margin: 0; font-size: clamp(40px, 5.4vw, 92px); font-weight: 700; line-height: 1.02; letter-spacing: -0.04em; color: #ffffff; white-space: nowrap;\">Neem contact op<span style=\"color: #ffffff;\">”<\u002Fspan><\u002Fh1>\n          <p style=\"margin: clamp(40px, 5.5vw, 88px) 0 0 0; max-width: 430px; font-size: 15px; font-weight: 400; line-height: 1.5; letter-spacing: -0.01em; color: #a3a3a3;\">Kies een onderwerp, laat je vraag achter en je <span style=\"color: #7d7d7d;\">traject<\u002Fspan> start binnen 24 uur.<\u002Fp>\n\n          <form sc-camel-on-submit=\"{{ onSubmit }}\" novalidate>\n          <div style=\"display: grid; grid-template-columns: {{ fieldCols }}; gap: clamp(40px, 6vw, 92px) 26px; margin-top: clamp(48px, 8vw, 128px);\">\n\n            <label style=\"display: block;\">\n              <span style=\"display: block; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: #ffffff;\">Voornaam*<\u002Fspan>\n              <input type=\"text\" name=\"voornaam\" autocomplete=\"given-name\" required aria-required=\"true\" aria-invalid=\"{{ invVoornaam }}\" aria-describedby=\"err-voornaam\" placeholder=\"Jim\" value=\"{{ vVoornaam }}\" sc-camel-on-change=\"{{ onVoornaam }}\" style=\"width: 100%; margin-top: 22px; padding: 0 0 13px 0; background: transparent; border: 0; border-bottom: 1px solid var(--dj-rule,rgba(242,245,249,0.14)); font-size: 16px; font-weight: 400; letter-spacing: -0.01em; color: #ffffff; transition: border-color 0.25s ease;\" style-focus=\"border-bottom-color: #ffffff;\">\n            \n              <p id=\"err-voornaam\" style=\"{{ errStyleVoornaam }}\">{{ errVoornaam }}<\u002Fp>\n            <\u002Flabel>\n\n            <label style=\"display: block;\">\n              <span style=\"display: block; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: #ffffff;\">Achternaam*<\u002Fspan>\n              <input type=\"text\" name=\"achternaam\" autocomplete=\"family-name\" required aria-required=\"true\" aria-invalid=\"{{ invAchternaam }}\" aria-describedby=\"err-achternaam\" placeholder=\"Hopper\" value=\"{{ vAchternaam }}\" sc-camel-on-change=\"{{ onAchternaam }}\" style=\"width: 100%; margin-top: 22px; padding: 0 0 13px 0; background: transparent; border: 0; border-bottom: 1px solid var(--dj-rule,rgba(242,245,249,0.14)); font-size: 16px; font-weight: 400; letter-spacing: -0.01em; color: #ffffff; transition: border-color 0.25s ease;\" style-focus=\"border-bottom-color: #ffffff;\">\n            \n              <p id=\"err-achternaam\" style=\"{{ errStyleAchternaam }}\">{{ errAchternaam }}<\u002Fp>\n            <\u002Flabel>\n\n            <label style=\"display: block; position: relative;\">\n              <span style=\"display: block; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: #ffffff;\">Onderwerp<\u002Fspan>\n              <sc-raw-select name=\"onderwerp\" value=\"{{ vOnderwerp }}\" sc-camel-on-change=\"{{ onOnderwerp }}\" style=\"width: 100%; margin-top: 22px; padding: 0 28px 13px 0; background: transparent; border: 0; border-bottom: 1px solid var(--dj-rule,rgba(242,245,249,0.14)); font-size: 16px; font-weight: 400; letter-spacing: -0.01em; color: {{ selectColor }}; -webkit-appearance: none; appearance: none; cursor: pointer; transition: border-color 0.25s ease;\" style-focus=\"border-bottom-color: #ffffff;\">\n                <option value=\"\" style=\"color: #1D1D1D;\">Selecteer<\u002Foption>\n                <option value=\"scan\" style=\"color: #1D1D1D;\">Data Clarity Scan<\u002Foption>\n                <option value=\"dashboards\" style=\"color: #1D1D1D;\">Dashboards &amp; rapportage<\u002Foption>\n                <option value=\"automatisering\" style=\"color: #1D1D1D;\">Automatisering<\u002Foption>\n                <option value=\"ai\" style=\"color: #1D1D1D;\">AI-integratie<\u002Foption>\n                <option value=\"anders\" style=\"color: #1D1D1D;\">Iets anders<\u002Foption>\n              <\u002Fsc-raw-select>\n              <svg aria-hidden=\"true\" width=\"15\" height=\"9\" sc-camel-view-box=\"0 0 14 9\" fill=\"none\" style=\"position: absolute; right: 2px; bottom: 17px; pointer-events: none; color: #d4d4d4;\"><path d=\"M1 1L7 7L13 1\" stroke=\"currentColor\" stroke-width=\"1.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <\u002Flabel>\n\n            <label style=\"display: block;\">\n              <span style=\"display: block; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: #ffffff;\">E-mail*<\u002Fspan>\n              <input type=\"email\" name=\"email\" autocomplete=\"email\" required aria-required=\"true\" aria-invalid=\"{{ invEmail }}\" aria-describedby=\"err-email\" placeholder=\"info@datajagers.nl\" value=\"{{ vEmail }}\" sc-camel-on-change=\"{{ onEmail }}\" style=\"width: 100%; margin-top: 22px; padding: 0 0 13px 0; background: transparent; border: 0; border-bottom: 1px solid var(--dj-rule,rgba(242,245,249,0.14)); font-size: 16px; font-weight: 400; letter-spacing: -0.01em; color: #ffffff; transition: border-color 0.25s ease;\" style-focus=\"border-bottom-color: #ffffff;\">\n            \n              <p id=\"err-email\" style=\"{{ errStyleEmail }}\">{{ errEmail }}<\u002Fp>\n            <\u002Flabel>\n\n            <label style=\"display: block; grid-column: 1 \u002F -1;\">\n              <span style=\"display: block; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: #ffffff;\">Bericht*<\u002Fspan>\n              <textarea name=\"bericht\" required aria-required=\"true\" aria-invalid=\"{{ invBericht }}\" aria-describedby=\"err-bericht\" rows=\"4\" placeholder=\"Typ je bericht.....\" value=\"{{ vBericht }}\" sc-camel-on-change=\"{{ onBericht }}\" style=\"width: 100%; margin-top: 22px; padding: 0 0 16px 0; background: transparent; border: 0; border-bottom: 1px solid var(--dj-rule,rgba(242,245,249,0.14)); font-size: 16px; font-weight: 400; line-height: 1.6; letter-spacing: -0.01em; color: #ffffff; resize: vertical; min-height: 148px; transition: border-color 0.25s ease;\" style-focus=\"border-bottom-color: #ffffff;\"><\u002Ftextarea>\n            \n              <p id=\"err-bericht\" style=\"{{ errStyleBericht }}\">{{ errBericht }}<\u002Fp>\n            <\u002Flabel>\n          <\u002Fdiv>\n\n          <p role=\"status\" aria-live=\"polite\" style=\"{{ statusStyle }}\">{{ statusText }}<\u002Fp>\n          <button type=\"submit\" data-comment-anchor=\"contact-submit\" style=\"margin-top: clamp(40px, 6vw, 92px); width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 12px; padding: 15px 26px; border: 0; border-radius: 5px; background: {{ btnBg }}; color: #ffffff; font-size: 16px; font-weight: 400; letter-spacing: -0.01em; cursor: pointer; transition: background 0.25s ease;\" style-hover=\"background: {{ btnBgHover }};\">{{ btnLabel }}<\u002Fbutton>\n          <\u002Fform>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fsection>\n\n  <!-- ================= FAQ — schuift met diagonale snede over het gepinde formulier ================= -->\n  <div id=\"faq\" style=\"position: relative; z-index: 1;\">\n    <dc-import name=\"FAQ Sectie\" cta-label=\"Plan een gesprek\" cta-href=\"#contact\" hint-size=\"100%,720px\"><\u002Fdc-import>\n    <!-- uitloop: laatste vraag + sticky kolom volledig in beeld vóór de footer-reveal -->\n    <div aria-hidden=\"true\" style=\"height: clamp(200px, 38vh, 420px); background: var(--dj-surface,#f6f6f4);\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <\u002Fdiv><!-- einde page-hold -->\n\n  <!-- ================= FOOTER — gedeeld component ================= -->\n\n<\u002Fmain><!--\u002Fdj:main--><dc-import name=\"Footer\" home=\"index.html\" contact-href=\"#contact\" cta-href=\"#contact\" cta-label=\"Naar het formulier\" hint-size=\"100%,2200px\"><\u002Fdc-import>\n\n  <!-- persistente bodemfog — continuïteit door de hele scroll -->\n  <div data-dj-fog=\"\" aria-hidden=\"true\" style=\"position: fixed; left: 0; right: 0; bottom: 0; height: 96px; pointer-events: none; z-index: 30; background: linear-gradient(to top, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.02) 55%, rgba(255,255,255,0) 100%); -webkit-backdrop-filter: blur(12px) saturate(1.35) brightness(1.04); backdrop-filter: blur(12px) saturate(1.35) brightness(1.04); -webkit-mask-image: linear-gradient(to top, #000 0%, #000 26%, transparent 100%); mask-image: linear-gradient(to top, #000 0%, #000 26%, transparent 100%);\"><\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text\u002Fx-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;submitLabel&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Verstuur&quot;, &quot;tsType&quot;: &quot;string&quot; }\n}\">\nclass Component extends DCLogic {\n  state = {\n    mobile: (typeof window !== 'undefined' ? window.innerWidth < 860 : false),\n    narrow: (typeof window !== 'undefined' ? window.innerWidth < 1180 : false),\n    form: { voornaam: '', achternaam: '', onderwerp: '', email: '', bericht: '' },\n    errors: {},\n    sent: false,\n    menuOpen: false,\n  };\n\n  componentDidMount() {\n    this._mq = window.matchMedia('(max-width: 859px)');\n    this._onMq = (e) => { this.setState({ mobile: e.matches }); this._fitPageHold(); };\n    this.setState({ mobile: this._mq.matches });\n    if (this._mq.addEventListener) this._mq.addEventListener('change', this._onMq);\n    this._mqN = window.matchMedia('(max-width: 1179px)');\n    this._onMqN = (e) => this.setState({ narrow: e.matches, menuOpen: false });\n    this.setState({ narrow: this._mqN.matches });\n    if (this._mqN.addEventListener) this._mqN.addEventListener('change', this._onMqN);\n\n    \u002F\u002F footer sheet-reveal — identiek aan de hoofdpagina\n    this._onScroll = () => {\n      this._startWig();\n      if (this._raf) return;\n      this._raf = requestAnimationFrame(() => { this._raf = null; this._applyFooterSheet(); });\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._onResize = () => { this._fitPageHold(); this._applyFooterSheet(); };\n    window.addEventListener('resize', this._onResize);\n\n    this._fitPageHold();\n    this._applyFooterSheet();\n    this._startWig();\n    const hold = document.querySelector('[data-page-hold]');\n    if (hold && window.ResizeObserver) {\n      this._ro = new ResizeObserver(() => this._fitPageHold());\n      this._ro.observe(hold);\n    }\n  }\n\n  componentWillUnmount() {\n    if (this._mq && this._mq.removeEventListener) this._mq.removeEventListener('change', this._onMq);\n    if (this._mqN && this._mqN.removeEventListener) this._mqN.removeEventListener('change', this._onMqN);\n    window.removeEventListener('scroll', this._onScroll);\n    window.removeEventListener('resize', this._onResize);\n    if (this._ro) this._ro.disconnect();\n    if (this._raf) cancelAnimationFrame(this._raf);\n    if (this._wigRaf) cancelAnimationFrame(this._wigRaf);\n  }\n\n  \u002F\u002F diagonale wig: kantelt van horizontaal naar diagonaal tijdens het scrollen,\n  \u002F\u002F met een onderkritisch gedempte veer (licht overshoot = elastisch gevoel)\n  _startWig() {\n    if (this._wigRaf) return;\n    if (this._wigT === undefined) { this._wigT = 0; this._wigV = 0; }\n    const step = () => {\n      const wig = document.querySelector('[data-faq-wig]');\n      const faq = document.getElementById('faq');\n      if (!wig || !faq) { this._wigRaf = null; return; }\n      const vh = window.innerHeight;\n      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n      const r = faq.getBoundingClientRect();\n      const raw = Math.max(0, Math.min(1, (vh * 1.25 - r.top) \u002F (vh * 0.85)));\n      \u002F\u002F scroll delay: het doel hobbelt vertraagd achter de scroll aan\n      if (this._wigD === undefined) this._wigD = raw;\n      this._wigD += (raw - this._wigD) * (reduce ? 1 : 0.07);\n      const target = this._wigD;\n      if (reduce) {\n        this._wigT = target; this._wigV = 0;\n      } else {\n        this._wigV += (target - this._wigT) * 0.106;\n        this._wigV *= 0.875;\n        this._wigT += this._wigV;\n      }\n      const t = Math.max(0, Math.min(1.15, this._wigT));\n      const y = (100 - t * 100).toFixed(2);\n      wig.style.clipPath = 'polygon(0 100%, 100% ' + y + '%, 100% 100%)';\n      \u002F\u002F de wig groeit mee in hoogte: van 35% naar 100% van zijn maximum\n      const maxH = Math.min(225, Math.max(105, window.innerWidth * 0.135));\n      wig.style.height = (maxH * (0.35 + 0.65 * Math.min(1, t))).toFixed(1) + 'px';\n      if (!reduce && (Math.abs(raw - this._wigT) > 0.001 || Math.abs(this._wigV) > 0.001 || Math.abs(raw - this._wigD) > 0.001)) {\n        this._wigRaf = requestAnimationFrame(step);\n      } else {\n        this._wigRaf = null;\n      }\n    };\n    this._wigRaf = requestAnimationFrame(step);\n  }\n\n  _applyFooterSheet() {\n    const track = document.querySelector('[data-foot-track]');\n    const sheet = document.querySelector('[data-foot-sheet]');\n    if (!track || !sheet) return;\n    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { sheet.style.transform = 'none'; return; }\n    const r = track.getBoundingClientRect();\n    const total = r.height - window.innerHeight;\n    const p = Math.max(0, Math.min(1, (-r.top) \u002F total));\n    const e = 1 - Math.pow(1 - p, 3);\n    sheet.style.transform = 'translateY(' + ((1 - e) * 101).toFixed(2) + '%)';\n  }\n\n  \u002F\u002F sticky top = -(inhoudshoogte - viewport): de content pint zodra zijn onderkant de\n  \u002F\u002F viewportbodem raakt en staat dan compositor-stil terwijl de footer eroverheen schuift.\n  _fitPageHold() {\n    const hold = document.querySelector('[data-page-hold]');\n    if (hold) {\n      const val = (-(Math.max(0, hold.offsetHeight - window.innerHeight))).toFixed(0) + 'px';\n      if (hold.style.position !== 'sticky') hold.style.position = 'sticky';\n      if (hold.style.top !== val) hold.style.top = val;\n    }\n    \u002F\u002F zelfde truc voor het contactformulier: pint zodra zijn onderkant in beeld is,\n    \u002F\u002F waarna de FAQ er met de diagonale wig overheen schuift\n    const pin = document.querySelector('[data-contact-pin]');\n    if (pin) {\n      const val = (-(Math.max(0, pin.offsetHeight - window.innerHeight))).toFixed(0) + 'px';\n      if (pin.style.position !== 'sticky') pin.style.position = 'sticky';\n      if (pin.style.top !== val) pin.style.top = val;\n    }\n  }\n\n  set(key) {\n    return (e) => {\n      const v = e && e.target ? e.target.value : '';\n      this.setState((s) => {\n        const errors = Object.assign({}, s.errors);\n        delete errors[key];\n        return { form: Object.assign({}, s.form, { [key]: v }), errors: errors, sent: false };\n      });\n    };\n  }\n\n  ONDERWERPEN = {\n    '': 'Niet opgegeven',\n    scan: 'Data Clarity Scan',\n    dashboards: 'Dashboards & rapportage',\n    automatisering: 'Automatisering',\n    ai: 'AI-integratie',\n    anders: 'Iets anders',\n  };\n\n  renderVals() {\n    const f = this.state.form;\n    const err = this.state.errors || {};\n    const errStyle = (msg) => 'margin: 8px 0 0; font-size: 13.5px; line-height: 1.45; color: #ff9f9f; display: '\n      + (msg ? 'block' : 'none') + ';';\n    return {\n      heroCols: this.state.mobile ? '1fr' : '1.25fr 1fr',\n      fieldCols: this.state.mobile ? '1fr' : '1fr 1fr',\n      footCols: this.state.mobile ? '1fr' : 'minmax(0, 1.5fr) minmax(240px, 1fr)',\n      selectColor: f.onderwerp ? '#ffffff' : '#7d7d7d',\n      vVoornaam: f.voornaam, vAchternaam: f.achternaam, vOnderwerp: f.onderwerp,\n      vEmail: f.email, vBericht: f.bericht,\n      onVoornaam: this.set('voornaam'),\n      onAchternaam: this.set('achternaam'),\n      onOnderwerp: this.set('onderwerp'),\n      onEmail: this.set('email'),\n      onBericht: this.set('bericht'),\n      onSubmit: (e) => {\n        if (e && e.preventDefault) e.preventDefault();\n        const v = this.state.form;\n        const errors = {};\n        if (!String(v.voornaam || '').trim()) errors.voornaam = 'Vul je voornaam in.';\n        if (!String(v.achternaam || '').trim()) errors.achternaam = 'Vul je achternaam in.';\n        if (!\u002F^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$\u002F.test(String(v.email || '').trim())) {\n          errors.email = 'Vul een geldig e-mailadres in.';\n        }\n        if (!String(v.bericht || '').trim()) errors.bericht = 'Laat een bericht achter.';\n\n        if (Object.keys(errors).length) {\n          this.setState({ errors: errors, sent: false });\n          \u002F\u002F Move focus to the first field that failed so the error is announced.\n          const first = ['voornaam', 'achternaam', 'email', 'bericht']\n            .find((k) => errors[k]);\n          const el = document.querySelector('[name=\"' + first + '\"]');\n          if (el && el.focus) el.focus();\n          return;\n        }\n\n        \u002F\u002F No backend ships with this site, so the form hands the message to the\n        \u002F\u002F visitor's mail client with every field laid out — the lead arrives as\n        \u002F\u002F a real email instead of being dropped on the floor.\n        const onderwerp = (this.ONDERWERPEN[v.onderwerp] || 'Niet opgegeven');\n        const body = [\n          'Naam: ' + v.voornaam + ' ' + v.achternaam,\n          'E-mail: ' + v.email,\n          'Onderwerp: ' + onderwerp,\n          '',\n          'Bericht:',\n          v.bericht,\n        ].join('\\n');\n        window.location.href = 'mailto:info@datajagers.nl'\n          + '?subject=' + encodeURIComponent('Aanvraag via datajagers.nl — ' + onderwerp)\n          + '&body=' + encodeURIComponent(body);\n        this.setState({ errors: {}, sent: true });\n      },\n      errVoornaam: err.voornaam || '', errStyleVoornaam: errStyle(err.voornaam),\n      errAchternaam: err.achternaam || '', errStyleAchternaam: errStyle(err.achternaam),\n      errEmail: err.email || '', errStyleEmail: errStyle(err.email),\n      errBericht: err.bericht || '', errStyleBericht: errStyle(err.bericht),\n      invVoornaam: err.voornaam ? 'true' : 'false',\n      invAchternaam: err.achternaam ? 'true' : 'false',\n      invEmail: err.email ? 'true' : 'false',\n      invBericht: err.bericht ? 'true' : 'false',\n      statusText: this.state.sent\n        ? 'Je mailprogramma is geopend met je bericht. Verstuur het daar om de aanvraag af te ronden.'\n        : (Object.keys(err).length ? 'Controleer de gemarkeerde velden.' : ''),\n      statusStyle: 'margin: 24px 0 0; font-size: 14px; line-height: 1.5; color: '\n        + (this.state.sent ? '#7fd4a8' : '#ff9f9f') + '; display: '\n        + (this.state.sent || Object.keys(err).length ? 'block' : 'none') + ';',\n      btnLabel: this.state.sent ? 'Geopend in je mailprogramma' : (this.props.submitLabel || 'Verstuur'),\n      btnBg: this.state.sent ? '#1f8a5b' : '#3a3a3a',\n      btnBgHover: this.state.sent ? '#1f8a5b' : '#4a4a4a',\n\n      footLinks: [\n        { label: 'Home', href: 'index.html', num: '01' },\n        { label: 'Wie we zijn', href: 'index.html#verhaal', num: '02' },\n        { label: 'Diensten', href: 'index.html#diensten', num: '03' },\n        { label: 'FAQ', href: 'index.html#faq', num: '04' },\n        { label: 'Contact', href: '#contact', num: '05' },\n      ],\n    };\n  }\n}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
