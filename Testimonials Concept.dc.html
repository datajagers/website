<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fragment+Mono&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--dj-surface,#f6f6f4); }
    body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    a:hover { color: inherit; }
    button { font: inherit; }
    @keyframes tmCaret { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes tmWord { from { opacity: 0; transform: translateY(0.18em); filter: blur(5px); } to { opacity: 1; transform: none; filter: blur(0); } }
    @keyframes tmMeta { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes tmSlashIn { from { transform: translateY(1.05em); } to { transform: none; } }
    @keyframes tmNumIn { from { transform: translateY(-1.05em); } to { transform: none; } }
    /* CTA — zelfde gedrag als de footer-CTA: label schuift, pijl draait recht */
    /* mobiel: tapdoel >= 44px zonder visuele verschuiving */
    @media (max-width: 859px) { [data-tm-cta] { padding-top: 14px; } }
    @keyframes tmSwipe { from { clip-path: inset(0 100% 0 0); -webkit-clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0% 0 0); -webkit-clip-path: inset(0 0% 0 0); } }
  </style>
  <script src="./image-slot.js"></script>
</helmet>

<section data-tm-root="" data-screen-label="Testimonials concept" style="position: relative; background: transparent; color: var(--dj-ink,#1D1D1D); font-family: 'Plus Jakarta Sans', system-ui, sans-serif;">
  <div style="position: relative; overflow: hidden; display: flex; align-items: center; min-height: 100vh; padding: clamp(48px, 6vh, 96px) 0;">
  <div data-tm-stage="" style="position: relative; width: 100%; padding-top: {{ padTop }};">
  <!-- stille backdrop rechts: happy-person-2 vult 2/3 van de sectie, persoon in beeld,
       linkerrand lost zacht op in de surface -->
  <div aria-hidden="true" style="position: absolute; top: 0; right: 0; bottom: 0; left: 66.7%; pointer-events: none; background: url('uploads/happy-person-2.jpg') 30% 20% / cover no-repeat; filter: grayscale(1) contrast(1.05); opacity: {{ backdropOpacity }}; -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 34%), linear-gradient(to bottom, transparent 0%, #000 22%, #000 78%, transparent 100%); -webkit-mask-composite: source-in; mask-image: linear-gradient(to right, transparent 0%, #000 34%), linear-gradient(to bottom, transparent 0%, #000 22%, #000 78%, transparent 100%); mask-composite: intersect;"></div>
  <div style="max-width: 1320px; margin: 0 auto; padding: 0 clamp(24px, 4vw, 64px) {{ padBottom }};">

    <div data-tm-px="0.5" style="will-change: transform, opacity;"><dc-import name="Sectiekop" num="06" label="Wat collega's zeggen" right="{{ counterLabel }}" tone="dark" hint-size="100%,60px"></dc-import></div>

    <!-- displaykop + intro — uitgelijnd op de linkerkant van de foto -->
    <div data-tm-px="0.9" style="will-change: transform, opacity; margin-top: clamp(36px, 4.5vw, 64px); display: grid; grid-template-columns: {{ kopCols }}; gap: clamp(28px, 5vw, 96px);">
      <div aria-hidden="true" style="display: {{ kopSpacerDisplay }};"></div>
      <div style="min-width: 0;">
        <h2 style="margin: 0; font-size: {{ kopSize }}; font-weight: 700; line-height: 0.98; letter-spacing: -0.045em; color: var(--dj-ink,#1D1D1D);">Echte mensen.<br><span style="color: color-mix(in srgb, var(--dj-ink,#1D1D1D) 55%, transparent);">Echte verhalen.</span></h2>
        <p style="display: {{ introDisplay }}; margin: clamp(20px, 2.5vw, 32px) 0 0; max-width: 46ch; font-size: clamp(15px, 0.85vw, 16px); font-weight: 400; line-height: 1.6; letter-spacing: -0.01em; color: var(--dj-muted,#6f6f6f);">Ongefilterde woorden van de mensen met wie we dagelijks aan data, dashboards en AI werken.</p>
      </div>
    </div>

    <!-- podium: pijlen | portret | citaat -->
    <div data-tm-px="1.4" style="will-change: transform, opacity; margin-top: {{ stageMargin }}; display: grid; grid-template-columns: {{ stageCols }}; gap: clamp(28px, 5vw, 96px); align-items: stretch;">

      <!-- prev/next — rond, hairline, hover-blauw -->
      <div style="display: flex; align-items: flex-start; gap: 10px; {{ arrowsStyle }}">
        <button type="button" aria-label="Vorige quote" onClick="{{ prev }}" style="width: 48px; height: 48px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--dj-ink,#1D1D1D) 35%, transparent); background: transparent; color: var(--dj-ink,#1D1D1D); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);" style-hover="background: var(--dj-ink,#1D1D1D); border-color: var(--dj-ink,#1D1D1D); color: #ffffff; transform: scale(1.06);" style-active="transform: scale(0.96);"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>
        <button type="button" aria-label="Volgende quote" onClick="{{ next }}" style="width: 48px; height: 48px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--dj-ink,#1D1D1D) 35%, transparent); background: transparent; color: var(--dj-ink,#1D1D1D); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);" style-hover="background: var(--dj-ink,#1D1D1D); border-color: var(--dj-ink,#1D1D1D); color: #ffffff; transform: scale(1.06);" style-active="transform: scale(0.96);"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
      </div>

      <!-- citaat + auteur -->
      <div style="min-width: 0; display: flex; flex-direction: column;">
        <blockquote data-tm-quote="" aria-live="polite" style="margin: 0; min-height: {{ quoteMinH }}; font-size: {{ quoteSize }}; font-weight: 600; line-height: 1.45; letter-spacing: -0.015em; color: var(--dj-ink,#1D1D1D); transition: {{ quoteTrans }}; opacity: {{ quoteOpacity }};"><span style="color: color-mix(in srgb, var(--dj-ink,#1D1D1D) 55%, transparent);">&ldquo;</span><sc-for list="{{ quoteWords }}" as="w" hint-placeholder-count="10"><span style="{{ w.style }}">{{ w.text }}</span> </sc-for><span style="color: color-mix(in srgb, var(--dj-ink,#1D1D1D) 55%, transparent); {{ endQuoteStyle }}">&rdquo;</span></blockquote>
        <div style="margin-top: auto; padding-top: clamp(28px, 4vw, 56px);">
          <div style="font-size: clamp(17px, 1.1vw, 21px); font-weight: 700; letter-spacing: -0.02em; color: var(--dj-ink,#1D1D1D); {{ authorStyle }}">{{ activeAuthor }}</div>
          <div style="margin-top: 8px; font-family: 'Fragment Mono', ui-monospace, monospace; font-size: 14px; letter-spacing: 0.02em; text-transform: uppercase; color: color-mix(in srgb, var(--dj-ink,#1D1D1D) 55%, transparent); {{ roleStyle }}">{{ activeRole }}</div>
          <a data-cta data-tm-cta="" href="{{ ctaHref }}" style="margin-top: clamp(22px, 2.6vw, 34px); display: inline-flex; align-items: baseline; gap: 12px; color: var(--dj-ink,#1D1D1D); border-bottom: 1px solid color-mix(in srgb, var(--dj-ink,#1D1D1D) 70%, transparent); padding-bottom: 10px;" style-hover="color: var(--dj-hover,#1f66c4);">
            <span class="tc-label" style="display: inline-block; font-size: clamp(15px, 0.85vw, 16px); font-weight: 400; letter-spacing: -0.02em;">{{ ctaLabel }}</span>
            <svg class="tc-arrow" viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true" style="flex: none;"><path d="M1 11 11 1M4 1h7v7"></path></svg>
          </a>
        </div>
      </div>
    </div>

    <!-- reuzenteller — referentie "/3", mono en gedimd -->
    <div data-tm-px="2" aria-hidden="true" style="will-change: transform, opacity; margin-top: clamp(28px, 3.5vw, 48px); display: {{ counterRowDisplay }}; align-items: baseline; justify-content: space-between; gap: 24px;">
      <span style="font-family: 'Fragment Mono', ui-monospace, monospace; font-size: clamp(44px, 5vw, 88px); line-height: 1.12; color: color-mix(in srgb, var(--dj-ink,#1D1D1D) 35%, transparent); font-feature-settings: 'tnum'; display: inline-flex; overflow: hidden;"><span style="display: inline-block; {{ slashStyle }}">/</span><span style="display: inline-block; {{ numStyle }}">{{ activeNum }}</span></span>
      <span style="font-family: 'Fragment Mono', ui-monospace, monospace; font-size: 14px; color: color-mix(in srgb, var(--dj-ink,#1D1D1D) 60%, transparent); font-feature-settings: 'tnum';">./ ECHTE MENSEN, ECHTE SAMENWERKING</span>
    </div>

  </div>
  </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1320, &quot;height&quot;: 1080 },
  &quot;autoRotate&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Gedrag&quot; },
  &quot;backdrop&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Gedrag&quot; },
  &quot;compact&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Gedrag&quot; },
  &quot;ctaHref&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;contact.html&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Call-to-action&quot; },
  &quot;ctaLabel&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Ik wil dit ook&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Call-to-action&quot; }
}">
class Component extends DCLogic {
  data = [
    { quote: 'Wouter is goud waard. Hij pakt zaken meteen op en heeft het bijzondere vermogen om een complexe vraag uit een halve zin te begrijpen. Als strategische sparringpartner kijkt hij steevast vanuit een andere hoek, waardoor hij verborgen inzichten en \u2018verstopte tabellen\u2019 boven tafel haalt die het begrip van een project flink vergroten.',
      author: 'Thomas Hendriks', role: 'Digital Product Manager', num: '01' },
    { quote: 'Met een scherp oog voor effici\u00ebntie pakt Wouter procesverbeteringen proactief op en zorgt hij dat geen moeite verloren gaat. Hij stelt altijd de cruciale vraag: \u2018Wat wil je met deze data bereiken?\u2019 Dat dwingt tot een extra reflectieslag, waardoor tijd gaat naar projecten die echt waarde toevoegen in plaats van rapportages die in de la belanden.',
      author: 'Maud Hermans', role: 'SEO Content Marketeer', num: '02' },
    { quote: 'Wouters grootste kracht is zijn conceptuele denkvermogen en zijn talent om structuur te scheppen in chaos. Dat blijkt vooral wanneer hij complexe datastromen ontwart of dashboardeisen scherp krijgt. Met zijn gestructureerde blik en drang naar consistentie legt hij een rotsvast fundament onder elk project \u2014 een echte aanwinst voor ieder team.',
      author: 'Jasper Smit', role: 'Lead Business Analyst', num: '03' },
  ];
  CYCLE = 15000;          // real quotes run ~55 words; 7s cut readers off mid-sentence
  REVEAL = 1.5;           // seconds the word-by-word reveal spans, whatever the length
  _stagger(n) { return Math.min(0.18, this.REVEAL / Math.max(1, n)); }
  state = { active: 0, displayed: 0, phase: 'idle', typed: 0, mobile: (typeof window !== 'undefined' ? window.innerWidth < 1024 : false) };

  componentDidMount() {
    this._mounted = true;
    this.reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    this._mq = window.matchMedia('(max-width: 1023px)');
    this._onMq = (e) => this.setState({ mobile: e.matches });
    this.setState({ mobile: this._mq.matches });
    if (this._mq.addEventListener) this._mq.addEventListener('change', this._onMq);
    if ((this.props.autoRotate ?? true) && !this.reduce) {
      this._startCycle();
      // WCAG 2.2.2 — auto-advancing content needs a way to pause. The quotes now
      // take real time to read, so hovering or tabbing into the section holds
      // the current one until the visitor leaves.
      this._bindHold();
    }
  }

  _bindHold(tries = 0) {
    const root = document.querySelector('[data-tm-root]');
    if (!root) { if (tries < 10) setTimeout(() => this._bindHold(tries + 1), 300); return; }
    this._root = root;
    this._hold = () => clearInterval(this._cycle);
    this._resume = () => { if (this._mounted) this._startCycle(); };
    root.addEventListener('mouseenter', this._hold);
    root.addEventListener('mouseleave', this._resume);
    root.addEventListener('focusin', this._hold);
    root.addEventListener('focusout', this._resume);
  }
  componentWillUnmount() {
    this._mounted = false;
    clearInterval(this._cycle); clearInterval(this._type); clearTimeout(this._t1); clearTimeout(this._t2);
    if (this._mq && this._mq.removeEventListener) this._mq.removeEventListener('change', this._onMq);
    if (this._root) {
      this._root.removeEventListener('mouseenter', this._hold);
      this._root.removeEventListener('mouseleave', this._resume);
      this._root.removeEventListener('focusin', this._hold);
      this._root.removeEventListener('focusout', this._resume);
    }
  }
  _startCycle() {
    clearInterval(this._cycle);
    this._cycle = setInterval(() => { this._go((this.state.active + 1) % this.data.length); }, this.CYCLE);
  }
  _go(i, force) {
    if (i === this.state.active) return;
    if (this.state.phase !== 'idle') {
      // Automatische rotatie wacht netjes; een klik onderbreekt. De lopende
      // overgang wordt afgekapt en de gekozen quote staat er direct — snel
      // doorklikken voelt als bladeren in plaats van genegeerd worden.
      if (!force) return;
      clearTimeout(this._t1); clearTimeout(this._t2);
      this.setState({ active: i, displayed: i, phase: 'idle' });
      return;
    }
    if (this.reduce) { this.setState({ active: i, displayed: i }); return; }
    this.setState({ phase: 'out', active: i });
    this._t1 = setTimeout(() => {
      if (!this._mounted) return;
      this.setState({ displayed: i, phase: 'in' });
      // woord-voor-woord reveal: layout staat vast (hele quote gerenderd),
      // elk woord fadet/blurt gestaffeld in — geen reflow, geen springende regels
      const n = this.data[i].quote.split(' ').length;
      const total = (0.24 + (n - 1) * this._stagger(n) + 1.0) * 1000;
      this._t2 = setTimeout(() => { if (this._mounted) this.setState({ phase: 'idle' }); }, total + 250);
    }, 560);
  }
  _step(d) {
    const n = this.data.length;
    this._go((this.state.active + d + n) % n, true);
    if ((this.props.autoRotate ?? true) && !this.reduce) {
      this._startCycle();
      // WCAG 2.2.2 — auto-advancing content needs a way to pause. The quotes now
      // take real time to read, so hovering or tabbing into the section holds
      // the current one until the visitor leaves.
      this._bindHold();
    }
  }

  _bindHold(tries = 0) {
    const root = document.querySelector('[data-tm-root]');
    if (!root) { if (tries < 10) setTimeout(() => this._bindHold(tries + 1), 300); return; }
    this._root = root;
    this._hold = () => clearInterval(this._cycle);
    this._resume = () => { if (this._mounted) this._startCycle(); };
    root.addEventListener('mouseenter', this._hold);
    root.addEventListener('mouseleave', this._resume);
    root.addEventListener('focusin', this._hold);
    root.addEventListener('focusout', this._resume);
  }
  renderVals() {
    const { displayed, phase } = this.state;
    const cur = this.data[displayed];
    const compact = this.props.compact ?? false;
    return {
      // compact (in de 100vh curtain-laag): vh-gecapte maten + intro en
      // reuzenteller uit, zodat de sectie op elk scherm binnen één viewport past
      padTop: compact ? 'min(clamp(36px, 4vw, 56px), 4vh)' : 'clamp(56px, 7vw, 104px)',
      padBottom: compact ? 'min(clamp(36px, 4vw, 56px), 4vh)' : 'clamp(56px, 7vw, 104px)',
      kopSize: compact ? 'min(clamp(38px, 5vw, 88px), 8vh)' : 'clamp(44px, 7vw, 128px)',
      quoteSize: compact ? 'min(clamp(17px, 1.35vw, 24px), 2.9vh)' : 'clamp(19px, 1.7vw, 30px)',
      quoteMinH: compact ? '0' : '7.5em',
      stageMargin: compact ? 'min(clamp(28px, 3.5vw, 48px), 4vh)' : 'clamp(44px, 5.5vw, 80px)',
      introDisplay: compact ? 'none' : 'block',
      counterRowDisplay: compact ? 'none' : 'flex',
      stageCols: this.state.mobile ? '1fr' : '108px minmax(0, 1fr)',
      kopCols: this.state.mobile ? '1fr' : '108px minmax(0, 1fr)',
      kopSpacerDisplay: this.state.mobile ? 'none' : 'block',
      arrowsStyle: this.state.mobile ? 'order: 3;' : '',
      counterLabel: (this.data[this.state.active].num) + ' / 0' + this.data.length,
      activeNum: cur.num,
      // verticale rotatie: slash komt van onder naar boven, cijfer van boven naar onder
      slashY: phase === 'out' ? '-1.05em' : (phase === 'in' ? '1.05em' : '0'),
      numY: phase === 'out' ? '1.05em' : (phase === 'in' ? '-1.05em' : '0'),
      quoteWords: (() => {
        const words = cur.quote.split(' ');
        const st = this._stagger(words.length);
        return words.map((t, i) => ({
          text: t,
          style: phase === 'in'
            ? 'display: inline-block; animation: tmWord 1s cubic-bezier(0.22,1,0.36,1) ' + (0.24 + i * st).toFixed(2) + 's both;'
            : 'display: inline-block;',
        }));
      })(),
      endQuoteStyle: phase === 'in'
        ? 'display: inline-block; animation: tmWord 1s cubic-bezier(0.22,1,0.36,1) '
          + (0.24 + cur.quote.split(' ').length * this._stagger(cur.quote.split(' ').length)).toFixed(2) + 's both;'
        : 'display: inline-block;',
      backdropOpacity: this.props.backdrop ?? true ? '0.08' : '0',
      ctaHref: this.props.ctaHref ?? 'contact.html',
      ctaLabel: this.props.ctaLabel ?? 'Ik wil dit ook',
      activeAuthor: cur.author,
      activeRole: cur.role,
      // staggered reveal: uit = alles samen snel weg; in = foto -> citaat ->
      // auteur -> rol -> teller, elk met een eigen transition-delay
      quoteTrans: phase === 'out' ? 'opacity 0.48s ease' : 'none',
      quoteOpacity: phase === 'out' ? '0' : '1',
      // meta + teller starten direct mee met de woord-reveal (animatie tijdens 'in')
      authorStyle: phase === 'out' ? 'transition: opacity 0.48s ease, transform 0.52s ease; opacity: 0; transform: translateY(-8px);'
        : (phase === 'in' ? 'animation: tmMeta 0.9s cubic-bezier(0.22,1,0.36,1) 0.3s both;' : ''),
      roleStyle: phase === 'out' ? 'transition: opacity 0.48s ease, transform 0.52s ease; opacity: 0; transform: translateY(-8px);'
        : (phase === 'in' ? 'animation: tmMeta 0.9s cubic-bezier(0.22,1,0.36,1) 0.5s both;' : ''),
      slashStyle: phase === 'out' ? 'transition: transform 0.52s ease, opacity 0.48s ease; transform: translateY(-1.05em); opacity: 0.3;'
        : (phase === 'in' ? 'animation: tmSlashIn 0.9s cubic-bezier(0.22,1,0.36,1) 0.7s both;' : ''),
      numStyle: phase === 'out' ? 'transition: transform 0.52s ease, opacity 0.48s ease; transform: translateY(1.05em); opacity: 0.3;'
        : (phase === 'in' ? 'animation: tmNumIn 0.9s cubic-bezier(0.22,1,0.36,1) 0.7s both;' : ''),
      prev: () => this._step(-1),
      next: () => this._step(1),

    };
  }
}
</script>
</body>
</html>
