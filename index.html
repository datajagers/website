document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

" style=\"display:block;\"><\u002Fdc-import>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================================================ -->\n  <!-- ====== ESTAFETTE — adempauze wordt in-place de diensten-kop ====== -->\n  <div data-es-track=\"\" style=\"position: relative; height: 220vh; background: #1D1D1D;\">\n    <div data-es-stage=\"\" style=\"position: sticky; top: 0; height: 62vh; overflow: hidden;\">\n      <div data-es-scene=\"1\" style=\"position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(28px, 4vw, 44px); text-align: center; padding: 0 22px; will-change: transform, opacity;\">\n        <span style=\"font-family: 'Fragment Mono', ui-monospace, monospace; font-size: 12px; color: #8a828c;\">HERKENBAAR?<\u002Fspan>\n        <h2 style=\"margin: 0; max-width: 22ch; font-size: clamp(30px, 3.4vw, 60px); font-weight: 700; line-height: 1.15; letter-spacing: -0.03em; color: #ffffff; text-wrap: balance;\">Niet je mensen zitten vast. <span style=\"color: #8a828c;\">Je <span data-es-slot=\"a\" style=\"visibility: hidden;\">tooling<\u002Fspan> zit vast.<\u002Fspan><\u002Fh2>\n      <\u002Fdiv>\n      <div data-es-scene=\"2\" style=\"position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 clamp(24px, 4vw, 64px); opacity: 0; will-change: transform, opacity;\">\n        <div style=\"max-width: 1320px; margin: 0 auto; width: 100%;\">\n          <div style=\"display: flex; align-items: baseline; gap: 14px; border-bottom: 1px solid var(--dj-rule,rgba(242,245,249,0.14)); padding-bottom: 14px;\">\n            <span style=\"font-family: 'Fragment Mono', ui-monospace, monospace; font-size: 12px; color: #8a828c;\">(04)<\u002Fspan>\n            <span style=\"font-family: 'Fragment Mono', ui-monospace, monospace; font-size: 12px; color: #8a828c;\">(Diensten)<\u002Fspan>\n            <span style=\"margin-left: auto; font-family: 'Fragment Mono', ui-monospace, monospace; font-size: 12px; color: #8a828c;\">04 — TRAJECTEN<\u002Fspan>\n          <\u002Fdiv>\n          <h2 style=\"margin: 32px 0 0; max-width: 22ch; font-size: clamp(30px, 3.4vw, 60px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.15; color: #ffffff; text-wrap: balance;\"><span data-es-slot=\"b\" style=\"visibility: hidden;\">tooling<\u002Fspan> die wél meewerkt. <span style=\"color: #8a828c;\">En training die je team meeneemt.<\u002Fspan><\u002Fh2>\n          <p style=\"margin: 18px 0 0; max-width: 46ch; font-size: clamp(15px, 0.85vw, 16px); line-height: 1.6; color: #a3a3a3;\">Van procesoptimalisatie tot dashboards en AI-workflows — gebouwd mét je team, zodat het blijft werken als wij weg zijn.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <span data-es-word=\"\" aria-hidden=\"true\" style=\"position: absolute; left: 0; top: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.03em; line-height: 1.15; color: #ffffff; transform-origin: left top; will-change: transform; pointer-events: none; opacity: 0;\">tooling<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============== DIENSTEN — Waven case-player app =========== -->\n  <!-- ============================================================ -->\n  <section id=\"diensten\" data-nav-anchor data-diensten-pin=\"\" style=\"position: relative; z-index: 0; background: #1D1D1D;\">\n    <dc-import name=\"Diensten Sectie Concept\" row-href=\"contact.html\" cta-href=\"contact.html\" hint-size=\"100%,2000px\"><\u002Fdc-import>\n    <!-- het proces — gantt van de vier fasen, binnen dezelfde donkere band -->\n    <dc-import name=\"Proces Gantt\" hint-size=\"100%,900px\" style=\"display:block;\"><\u002Fdc-import>\n  <\u002Fsection>\n\n  <!-- ============================================================ -->\n  <!-- ===== DIENSTEN -> KLANTVERHALEN — diagonale wig-wipe ======= -->\n  <!-- diensten pint (sticky) zodra zijn onderkant in beeld is; de  -->\n  <!-- klantverhalen schuiven er met de diagonale snede overheen    -->\n  <!-- ============================================================ -->\n  <section id=\"proof-quotes\" data-tm-pin=\"\" style=\"position: relative; z-index: 1; background: var(--dj-surface,#f6f6f4);\">\n    <!-- diagonale wig: harde geometrische snede, links laag → rechts hoog -->\n    <div data-tm-wig=\"\" aria-hidden=\"true\" style=\"position: absolute; left: 0; right: 0; bottom: calc(100% - 1px); z-index: 1; height: clamp(70px, 9vw, 150px); background: var(--dj-surface,#f6f6f4); clip-path: polygon(0 100%, 100% 100%, 100% 100%); pointer-events: none;\"><\u002Fdiv>\n    <dc-import name=\"Testimonials Concept\" compact=\"{{ true }}\" cta-href=\"contact.html\" hint-size=\"100%,2200px\"><\u002Fdc-import>\n  <\u002Fsection>\n\n\n  <!-- ============================================================ -->\n  <!-- ============================================================ -->\n  <!-- ============== FAQ — diagonale wipe over gepind gevoel ===== -->\n  <!-- ============================================================ -->\n  <div id=\"faq\" style=\"position: relative; z-index: 2; background: #f6f6f4;\">\n    <dc-import name=\"FAQ Sectie\" cta-label=\"{{ ctaLabel }}\" cta-href=\"{{ ctaTarget }}\" hint-size=\"100%,720px\"><\u002Fdc-import>\n    <!-- uitloop: laatste vraag + sticky kolom komen volledig in beeld vóór de footer-reveal begint -->\n    <div aria-hidden=\"true\" style=\"height: clamp(200px, 38vh, 420px); background: #f6f6f4;\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <\u002Fdiv><!-- einde hero-follow -->\n  <!-- einde page-hold -->\n  <\u002Fdiv>\n\n  <!-- ============================================================ -->\n  <!-- ============== FOOTER — donker editorial =================== -->\n  <!-- ============================================================ -->\n\n<\u002Fmain><!--\u002Fdj:main--><dc-import name=\"Footer\" contact-href=\"contact.html\" cta-href=\"contact.html\" hint-size=\"100%,2200px\"><\u002Fdc-import>\n\n  <!-- persistent bottom fog — kleurneutraal liquid glass: geen witte tint, alleen\n       geblurde\u002Fverzadigde doorkijk + heel lichte sheen, werkt op elke achtergrondkleur -->\n  <div data-dj-fog=\"\" aria-hidden=\"true\" style=\"position: fixed; left: 0; right: 0; bottom: 0; height: 96px; pointer-events: none; z-index: 30; background: linear-gradient(to top, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.02) 55%, rgba(255,255,255,0) 100%); -webkit-backdrop-filter: blur(12px) saturate(1.35) brightness(1.04); backdrop-filter: blur(12px) saturate(1.35) brightness(1.04); -webkit-mask-image: linear-gradient(to top, #000 0%, #000 26%, transparent 100%); mask-image: linear-gradient(to top, #000 0%, #000 26%, transparent 100%);\"><\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text\u002Fx-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;ctaLabel&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Plan een gesprek&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Call-to-action&quot; },\n  &quot;ctaTarget&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;contact.html&quot;, &quot;options&quot;: [&quot;contact.html&quot;, &quot;#diensten&quot;, &quot;inzichten.html&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Call-to-action&quot; }\n}\">\nclass Component extends DCLogic {\n  state = { i: 0, w: (typeof window !== 'undefined' ? window.innerWidth : 1280), prog: 0, dashIn: false, footIn: false, dark: (typeof document !== 'undefined' && document.documentElement.classList.contains('dj-dark')) };\n\n  toggleTheme = () => {\n    const dark = !document.documentElement.classList.contains('dj-dark');\n    document.documentElement.classList.toggle('dj-dark', dark);\n    try { localStorage.setItem('dj-theme', dark ? 'dark' : 'light'); } catch (e) {}\n    this.setState({ dark: dark });\n  };\n\n  reduce = !!(typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);\n\n  metrics = [\n    { label: 'Omzet',             value: '\\u20ac2,41M', delta: '9,1%', up: true },\n    { label: 'Actieve gebruikers', value: '18.420',     delta: '6,2%', up: true },\n    { label: 'Conversie',         value: '4,8%',        delta: '1,3%', up: true },\n    { label: 'Churn',             value: '2,1%',        delta: '0,4%', up: true },\n    { label: 'Retentie',          value: '92,4%',       delta: '0,8%', up: true },\n  ];\n\n  \u002F\u002F diagonale wig (identiek aan de contactpagina): kantelt van horizontaal naar diagonaal\n  \u002F\u002F met scroll-delay + onderkritisch gedempte veer, en groeit mee in hoogte\n  \u002F\u002F twee instanties: FAQ (over het gevoel-blok) en klantverhalen (over diensten)\n  _wigConfigs = [\n    { wig: '[data-faq-wig]', sec: 'faq' },\n    { wig: '[data-tm-wig]', sec: 'proof-quotes' },\n    { wig: '[data-hk-boogkap]', sec: 'herkenbaar' },\n    { wig: '[data-wwz-wig]', sec: 'verhaal' },\n  ];\n  _startWig() {\n    if (this._wigRaf) return;\n    if (!this._wigS) this._wigS = this._wigConfigs.map(() => ({ t: 0, v: 0, d: undefined }));\n    const step = () => {\n      const vh = window.innerHeight;\n      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n      let busy = false, any = false;\n      this._wigConfigs.forEach((cfg, k) => {\n        const wig = document.querySelector(cfg.wig);\n        const sec = document.getElementById(cfg.sec);\n        if (!wig || !sec) return;\n        any = true;\n        const s = this._wigS[k];\n        const r = sec.getBoundingClientRect();\n        const raw = Math.max(0, Math.min(1, (vh * 1.25 - r.top) \u002F (vh * 0.85)));\n        if (s.d === undefined) s.d = raw;\n        s.d += (raw - s.d) * (reduce ? 1 : 0.07);\n        if (reduce) { s.t = s.d; s.v = 0; }\n        else {\n          s.v += (s.d - s.t) * 0.106;\n          s.v *= 0.875;\n          s.t += s.v;\n        }\n        const t = Math.max(0, Math.min(1.15, s.t));\n        if (wig.hasAttribute('data-hk-boogkap')) {\n          \u002F\u002F boog-echo: vlakke boog die afvlakt naarmate de sectie het beeld vult\n          const maxB = Math.min(180, window.innerWidth * 0.12);\n          wig.style.height = Math.max(5, (1 - Math.pow(Math.min(1, t), 1.4)) * maxB).toFixed(1) + 'px';\n        } else {\n          wig.style.clipPath = 'polygon(0 100%, 100% ' + (100 - t * 100).toFixed(2) + '%, 100% 100%)';\n          const maxH = Math.min(225, Math.max(105, window.innerWidth * 0.135));\n          wig.style.height = (maxH * (0.35 + 0.65 * Math.min(1, t))).toFixed(1) + 'px';\n        }\n        if (!reduce && (Math.abs(raw - s.t) > 0.001 || Math.abs(s.v) > 0.001 || Math.abs(raw - s.d) > 0.001)) busy = true;\n      });\n      this._wigRaf = (any && busy) ? requestAnimationFrame(step) : null;\n    };\n    this._wigRaf = requestAnimationFrame(step);\n  }\n\n  _applyFooterSheet() {\n    const track = document.querySelector('[data-foot-track]');\n    const sheet = document.querySelector('[data-foot-sheet]');\n    if (!track || !sheet) return;\n    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { sheet.style.transform = 'none'; return; }\n    const r = track.getBoundingClientRect();\n    const total = r.height - window.innerHeight;\n    const p = Math.max(0, Math.min(1, (-r.top) \u002F total));\n    const e = 1 - Math.pow(1 - p, 3);\n    sheet.style.transform = 'translateY(' + ((1 - e) * 101).toFixed(2) + '%)';\n    \u002F\u002F content vóór de footer staat stil via CSS sticky op [data-page-hold]; offset\n    \u002F\u002F wordt in _fitPageHold gezet (resize\u002FResizeObserver), niet per scroll-frame.\n  }\n\n  \u002F\u002F sticky top = -(inhoudshoogte - viewport): de wrapper pint exact wanneer zijn\n  \u002F\u002F onderkant de viewport-bodem raakt en staat dan compositor-stil terwijl de\n  \u002F\u002F footer-sheet eroverheen schuift.\n  _fitPageHold() {\n    \u002F\u002F gevoel-sectie pint zodra zijn onderkant in beeld is; de FAQ schuift er met de wig overheen\n    const pin = document.querySelector('[data-gevoel-pin]');\n    if (pin) {\n      const pv = (-(Math.max(0, pin.offsetHeight - window.innerHeight))).toFixed(0) + 'px';\n      if (pin.style.position !== 'sticky') pin.style.position = 'sticky';\n      if (pin.style.top !== pv) pin.style.top = pv;\n    }\n    \u002F\u002F diensten pint op dezelfde manier; de klantverhalen schuiven er met de wig overheen\n    const dpin = document.querySelector('[data-diensten-pin]');\n    if (dpin) {\n      const dv = (-(Math.max(0, dpin.offsetHeight - window.innerHeight))).toFixed(0) + 'px';\n      if (dpin.style.position !== 'sticky') dpin.style.position = 'sticky';\n      if (dpin.style.top !== dv) dpin.style.top = dv;\n    }\n    \u002F\u002F klantverhalen pinnen op dezelfde manier; de FAQ schuift er vlak overheen\n    const tpin = document.querySelector('[data-tm-pin]');\n    if (tpin) {\n      const tv = (-(Math.max(0, tpin.offsetHeight - window.innerHeight))).toFixed(0) + 'px';\n      if (tpin.style.position !== 'sticky') tpin.style.position = 'sticky';\n      if (tpin.style.top !== tv) tpin.style.top = tv;\n    }\n    const hold = document.querySelector('[data-page-hold]');\n    if (!hold) return;\n    const top = -(Math.max(0, hold.offsetHeight - window.innerHeight));\n    const val = top.toFixed(0) + 'px';\n    if (hold.style.position !== 'sticky') hold.style.position = 'sticky';\n    if (hold.style.top !== val) hold.style.top = val;\n  }\n\n  \u002F\u002F Wie we zijn (C) -> De belofte: GSAP ScrollTrigger scrubt de diepte-exit van de\n  \u002F\u002F gepinde C-viewport terwijl de belofte eroverheen schuift (CSS-sticky pin, React-veilig;\n  \u002F\u002F de sdb appear-animaties blijven ongemoeid — die draait sdb-driver zelf).\n  _startWwzST() {\n    return; \u002F\u002F scrub verhuisd naar wwz-st.js (remount-proof driver in de helmet)\n    if (this._wwzBound) return;\n    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    const bind = () => {\n      if (this._wwzBound) return;\n      const proof = document.getElementById('proof');\n      const wwz = document.getElementById('verhaal');\n      const inner = wwz && wwz.firstElementChild;\n      if (!(window.gsap && window.ScrollTrigger && proof && inner)) { setTimeout(bind, 400); return; }\n      this._wwzBound = true;\n      window.gsap.registerPlugin(window.ScrollTrigger);\n      this._wwzST = window.ScrollTrigger.create({\n        trigger: proof, start: 'top bottom', end: 'top top', scrub: true,\n        onUpdate: (self) => {\n          const e = self.progress;\n          inner.style.transform = 'translateY(' + (e * 56).toFixed(1) + 'px) scale(' + (1 - e * 0.025).toFixed(4) + ')';\n          inner.style.filter = 'brightness(' + (1 - e * 0.12).toFixed(3) + ')';\n        },\n      });\n    };\n    bind();\n  }\n\n  componentDidMount() {\n    \u002F\u002F PERF: removed a 3.2s setInterval that called setState for metric state which\n    \u002F\u002F the template never reads — it forced a full re-render of the entire page\n    \u002F\u002F (every imported section, incl. the WebGL dashboard) every 3.2s, forever.\n    \u002F\u002F The hero KPI ribbon is static, so nothing depended on it.\n    this._onResize = () => {\n      this.setState({ w: window.innerWidth });\n      this._fitPageHold();\n      if (this._applyReveals) requestAnimationFrame(this._applyReveals);\n      if (this._cwOpen) this._cwPose(true, true);   \u002F\u002F her-fit de open clip (px-waarde)\n    };\n    window.addEventListener('resize', this._onResize);\n\n    \u002F\u002F page-hold sticky offset volgt de contenthoogte (images\u002Ffonts\u002FDC's laden async)\n    this._fitPageHold();\n    this._startWwzST();\n    const holdEl = document.querySelector('[data-page-hold]');\n    if (holdEl && window.ResizeObserver) {\n      this._holdRO = new ResizeObserver(() => this._fitPageHold());\n      this._holdRO.observe(holdEl);\n    } else {\n      this._holdTimer = setInterval(() => this._fitPageHold(), 1200);\n    }\n\n    \u002F\u002F sectie- en paginalinks lopen via de globale interceptor in curtains.js\n\n    if (this.reduce) {\n      this.setState({ dashIn: true, footIn: true });\n    } else {\n      \u002F\u002F scroll-scrubbed reveal engine — direct DOM writes, no setState.\n      \u002F\u002F Two tiers: [data-rv] children cascade individually (n = stagger index,\n      \u002F\u002F data-rv-dir = up|left|right, data-plx = parallax factor); [data-reveal]\n      \u002F\u002F wrappers WITHOUT rv-children keep the old whole-block reveal.\n      this._collectFx = () => {\n        const rvNodes = Array.prototype.slice.call(document.querySelectorAll('[data-rv]'));\n        this._rvEls = rvNodes.map((el) => ({\n          el: el,\n          n: parseFloat(el.getAttribute('data-rv')) || 0,\n          dir: el.getAttribute('data-rv-dir') || 'up',\n          plx: parseFloat(el.getAttribute('data-plx')) || 0,\n          y: 0,\n        }));\n        rvNodes.forEach((el) => { el.style.willChange = 'opacity, transform'; });\n        this._revealEls = Array.prototype.slice.call(document.querySelectorAll('[data-reveal]')).filter((el) => {\n          if (el.querySelector('[data-rv]')) { el.style.opacity = '1'; el.style.transform = 'none'; return false; }\n          el.style.willChange = 'opacity, transform';\n          return true;\n        });\n      };\n      this._collectFx();\n      \u002F\u002F children stream in async — recollect for a while after mount\n      let colN = 0;\n      this._colT = setInterval(() => {\n        this._collectFx();\n        if (this._applyReveals) this._applyReveals();\n        if (++colN >= 12) clearInterval(this._colT);\n      }, 700);\n      this._applyReveals = () => {\n        const vh = window.innerHeight;\n        const rvs = this._rvEls || [], revs = this._revealEls || [];\n        \u002F\u002F PERF: batch all layout reads first, then all writes.\n        const rvRects = rvs.map((r) => r.el.getBoundingClientRect());\n        const revTops = revs.map((el) => el.getBoundingClientRect().top);\n        for (let k = 0; k < rvs.length; k++) {\n          const r = rvs[k], rect = rvRects[k];\n          const baseTop = rect.top - r.y; \u002F\u002F untranslated position\n          let t = (vh * 0.92 - baseTop) \u002F (vh * 0.30) - r.n * 0.12;\n          t = t < 0 ? 0 : t > 1 ? 1 : t;\n          const s = t * t * t * (t * (t * 6 - 15) + 10);\n          const plxY = r.plx ? (vh \u002F 2 - (baseTop + rect.height \u002F 2)) * r.plx : 0;\n          let x = 0, y = plxY;\n          if (r.dir === 'left') x = -(1 - s) * 60;\n          else if (r.dir === 'right') x = (1 - s) * 60;\n          else y += (1 - s) * 38;\n          r.y = y;\n          r.el.style.opacity = s.toFixed(3);\n          r.el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)';\n        }\n        for (let k = 0; k < revs.length; k++) {\n          let t = (vh * 0.90 - revTops[k]) \u002F (vh * 0.34);   \u002F\u002F enters from bottom, settles mid-screen\n          t = t < 0 ? 0 : t > 1 ? 1 : t;\n          const s = t * t * t * (t * (t * 6 - 15) + 10);\n          const el = revs[k];\n          el.style.opacity = s.toFixed(3);\n          el.style.transform = 'translate3d(0,' + ((1 - s) * 40).toFixed(1) + 'px,0)';\n        }\n      };\n      \u002F\u002F Diensten — gepinde stage: achtergrond staat stil, onderdelen vliegen in.\n      \u002F\u002F Layout wordt pas via JS omgezet (progressive enhancement): zonder JS\u002Freduce\n      \u002F\u002F blijft het een normale sectie.\n      this._initDStage = () => {\n        const wrap = document.getElementById('diensten');\n        const stage = wrap && wrap.querySelector('[data-ds-stage]');\n        const train = wrap && wrap.querySelector('[data-ds-train]');\n        if (!stage || !train || this._dsOn) return;\n        this._dsOn = true;\n        \u002F\u002F 420vh scrub + 150vh dode reserve aan het einde. De poort houdt de\n        \u002F\u002F pagina MIDDEN in die gepinde reserve stil: trackpad-momentum dat\n        \u002F\u002F tussen twee frames doorschiet blijft binnen de gepinde zone en is\n        \u002F\u002F dus onzichtbaar (geen jitter meer bij agressief scrollen).\n        wrap.style.height = '570vh';\n        \u002F\u002F testimonials-laag pint door de hele reserve heen, zodat de wipe op\n        \u002F\u002F elk holdpunt een stilstaande laag onthult\n        const pq = document.getElementById('proof-quotes');\n        if (pq) {\n          pq.style.marginTop = '-250vh';\n          const sp = pq.lastElementChild;\n          if (sp && sp !== pq.firstElementChild) sp.style.height = '150vh';\n        }\n        stage.style.position = 'sticky';\n        stage.style.top = '0';\n        stage.style.height = '100vh';\n        stage.style.overflow = 'hidden';\n        train.style.flexWrap = 'nowrap';\n        train.style.willChange = 'transform';\n      };\n      this._applyDStage = () => {\n        if (!this._dsOn) this._initDStage();\n        const wrap = document.getElementById('diensten');\n        const train = wrap && wrap.querySelector('[data-ds-train]');\n        if (!wrap || !train || !this._dsOn) return;\n        const vh = window.innerHeight;\n        const r = wrap.getBoundingClientRect();\n        const total = r.height - vh * 2.5;   \u002F\u002F laatste 150vh = dode reserve (poortzone)\n        let q = total > 0 ? -r.top \u002F total : 0;\n        q = q < 0 ? 0 : q > 1 ? 1 : q;\n\n        \u002F\u002F trein schuift van start (eerste kaart links) tot einde (laatste kaart in beeld)\n        const holder = train.parentElement;\n        const maxShift = Math.max(0, train.scrollWidth - holder.clientWidth);\n        train.style.transform = 'translate3d(' + (-q * maxShift).toFixed(1) + 'px,0,0)';\n\n        \u002F\u002F actieve kaart: uitgelicht met accentrand; rest gedimd\n        \u002F\u002F (overgeslagen zolang de entree-choreografie de kaarten bezit)\n        const cards = wrap.querySelectorAll('[data-ds-card]');\n        const act = Math.round(q * (cards.length - 1));\n        if (!this._dsIntroHold) for (let k = 0; k < cards.length; k++) {\n          const on = k === act;\n          const c = cards[k].getAttribute('data-c') || '#ffffff';\n          cards[k].style.opacity = on ? '1' : '0.45';\n          cards[k].style.transform = on ? 'translateY(-7px)' : 'translateY(0)';\n          cards[k].style.borderColor = on ? c : 'rgba(255,255,255,0.08)';\n          cards[k].style.boxShadow = on ? '0 24px 54px rgba(0,0,0,0.45)' : 'none';\n          const cta = cards[k].querySelector('[data-ds-cta]');\n          if (cta) { cta.style.opacity = on ? '1' : '0'; cta.style.pointerEvents = on ? 'auto' : 'none'; }\n        }\n\n        \u002F\u002F voortgangslijn + stations\n        const fill = wrap.querySelector('[data-ds-fill]');\n        if (fill) fill.style.width = (q * 100).toFixed(2) + '%';\n        const lbls = wrap.querySelectorAll('[data-ds-lbl]');\n        for (let k = 0; k < lbls.length; k++) {\n          lbls[k].style.color = k === act ? (lbls[k].getAttribute('data-c') || '#ffffff') : 'rgba(255,255,255,0.45)';\n        }\n      };\n\n      this._onScroll = () => {\n        if (this._raf) return;\n        this._startWig();\n        this._raf = requestAnimationFrame(() => { this._raf = null; this._applyReveals(); this._applyFooterSheet(); });\n      };\n      window.addEventListener('scroll', this._onScroll, { passive: true });\n      this._applyReveals();\n\n      const el = document.getElementById('dash-window');\n      if (el && 'IntersectionObserver' in window) {\n        this._io = new IntersectionObserver((entries) => {\n          entries.forEach((e) => {\n            if (e.isIntersecting) { this.setState({ dashIn: true }); this._io.disconnect(); }\n          });\n        }, { threshold: 0.12 });\n        this._io.observe(el);\n      } else {\n        this.setState({ dashIn: true });\n      }\n\n      const foot = document.getElementById('site-footer');\n      if (foot && 'IntersectionObserver' in window) {\n        this._iof = new IntersectionObserver((entries) => {\n          entries.forEach((e) => {\n            if (e.isIntersecting) { this.setState({ footIn: true }); this._iof.disconnect(); }\n          });\n        }, { threshold: 0.18 });\n        this._iof.observe(foot);\n      } else {\n        this.setState({ footIn: true });\n      }\n    }\n\n    \u002F\u002F slot-CTA verplaatst naar eigen component: Closing CTA.dc.html (silk-canvas ging mee)\n\n    \u002F\u002F Diensten -> Testimonials: GSAP ScrollTrigger clip-wipe curtain.\n    \u002F\u002F CSS-sticky pin (React-veilig) + ScrollTrigger scrubt de clip-path. De clip\n    \u002F\u002F staat NIET in de statische style, zodat DC re-renders hem niet overschrijven;\n    \u002F\u002F GSAP schrijft hem imperatief in onUpdate (zelf-herstellend per frame).\n    \u002F\u002F Diensten -> Testimonials: horizontale \"pulse\" clip-wipe (page-transition\n    \u002F\u002F gevoel). Het navy diensten-doek dekt de ACHTERLIGGENDE testimonials af en\n    \u002F\u002F veegt links->rechts weg; een heldere puls loopt mee op de veeg-rand. CSS-\n    \u002F\u002F sticky pin, zodat het NIET als verticaal scrollen voelt; GSAP ScrollTrigger\n    \u002F\u002F scrubt de voortgang. Clip\u002Ftransform staan niet in de statische style, zodat\n    \u002F\u002F DC re-renders ze niet overschrijven; zelf-herstellend tot gebonden.\n    {\n      const revealCover = () => {\n        const sec = document.getElementById('proof-quotes');\n        const cover = sec && sec.querySelector('[data-curtain-cover]');\n        if (cover) { cover.style.clipPath = 'inset(0% 0% 0% 100%)'; cover.style.webkitClipPath = 'inset(0% 0% 0% 100%)'; }\n      };\n      if (this.reduce) {\n        setTimeout(revealCover, 60); setTimeout(revealCover, 900);\n      } else {\n        const clamp = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);\n        const buildCurtain = () => {\n          if (!(window.gsap && window.ScrollTrigger)) return;\n          const sec = document.getElementById('proof-quotes');\n          const pin = sec && sec.querySelector('[data-curtain-pin]');\n          const cover = sec && sec.querySelector('[data-curtain-cover]');\n          const pulse = sec && sec.querySelector('[data-curtain-pulse]');\n          if (!sec || !pin || !cover || !pulse) return;\n          window.gsap.registerPlugin(window.ScrollTrigger);\n          const setP = (p) => {\n            p = clamp(p);\n            const c = 'inset(0% 0% 0% ' + (p * 100).toFixed(2) + '%)';\n            cover.style.clipPath = c; cover.style.webkitClipPath = c;\n            const W = pin.clientWidth || window.innerWidth;\n            pulse.style.transform = 'translateX(' + (p * W).toFixed(1) + 'px)';\n            pulse.style.opacity = Math.sin(p * Math.PI).toFixed(3);\n          };\n          if (this._curtainST) { try { this._curtainST.kill(); } catch (e) {} }\n          setP(0);\n          this._curtainST = window.ScrollTrigger.create({\n            trigger: sec, start: 'top top', end: 'bottom bottom', scrub: 0.7,\n            onUpdate: (self) => setP(self.progress),\n            onRefresh: (self) => setP(self.progress),\n          });\n          try { window.ScrollTrigger.refresh(); } catch (e) {}\n        };\n        const startT = Date.now();\n        const pump = () => {\n          const sec = document.getElementById('proof-quotes');\n          const bound = window.ScrollTrigger && sec && this._curtainST &&\n            window.ScrollTrigger.getAll().indexOf(this._curtainST) !== -1 &&\n            this._curtainST.trigger === sec;\n          if (!bound) buildCurtain();\n          if (Date.now() - startT < 9000) setTimeout(pump, 600);\n          else if (!bound) revealCover();\n        };\n        pump();\n        window.addEventListener('load', () => setTimeout(buildCurtain, 400));\n      }\n    }\n\n    \u002F\u002F Herkenbaar → Diensten: scroll-scrubbed push-through zoom (concept 1c)\n    if (this.reduce) {\n      setTimeout(() => {\n        this._dpApply(1);\n        \u002F\u002F reduced motion: geen pin\u002Fwipe — hero-track inklappen tot één scherm\n        const tr = document.querySelector('[data-hero-track]');\n        const fl = document.querySelector('[data-hero-follow]');\n        if (tr) { tr.style.height = '100vh'; const st = tr.firstElementChild; if (st) st.style.position = 'relative'; }\n        if (fl) fl.style.marginTop = '0';\n        const fog = document.querySelector('[data-dj-fog]');\n        if (fog) fog.style.opacity = '1';\n      }, 60);\n    } else {\n      this._dpApply(0);\n      this._dpFrame = this._dpFrame.bind(this);\n      this._dpRaf = requestAnimationFrame(this._dpFrame);\n    }\n  }\n\n  setupSilk() {\n    if (this.reduce) return;\n    const cv = document.getElementById('cta-silk');\n    if (!cv || !cv.getContext) return;\n    const ctx = cv.getContext('2d');\n    if (!ctx) return;\n\n    const DOWN = 0.4; \u002F\u002F backing-store downscale (pattern is low-frequency)\n    const fit = () => {\n      const p = cv.parentElement;\n      if (!p) return;\n      const r = p.getBoundingClientRect();\n      cv.width = Math.max(2, Math.round(r.width * DOWN));\n      cv.height = Math.max(2, Math.round(r.height * DOWN));\n    };\n    fit();\n    this._silkFit = fit;\n    window.addEventListener('resize', this._silkFit);\n\n    const noise = (x, y) => {\n      const G = 2.71828;\n      const rx = G * Math.sin(G * x);\n      const ry = G * Math.sin(G * y);\n      return (rx * ry * (1 + x)) % 1;\n    };\n\n    let t = 0;\n    const speed = 0.02;\n    const draw = (now) => {\n      this._silkRaf = requestAnimationFrame(draw);\n      \u002F\u002F PERF: cap the per-pixel ImageData loop at ~30fps instead of 60\n      if (now !== undefined && now - (this._silkLast || 0) < 33) return;\n      this._silkLast = now || 0;\n      const w = cv.width, h = c
